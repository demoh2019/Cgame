name: Upstream Basis, startup cleanup and status docs regression

on:
  push:
    branches: [develop]
    paths:
      - 'main/main.cpp'
      - 'modules/basis_universal/SCsub'
      - 'doc/classes/StatusIndicator.xml'
      - 'misc/scripts/tests/test_upstream_cleanup_basis_status.py'
      - '.github/workflows/upstream-cleanup-basis-status.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'main/main.cpp'
      - 'modules/basis_universal/SCsub'
      - 'doc/classes/StatusIndicator.xml'
      - 'misc/scripts/tests/test_upstream_cleanup_basis_status.py'
      - '.github/workflows/upstream-cleanup-basis-status.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-cpp-regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify production C++ cleanup path, SCons flags, and class XML
        run: |
          python -m py_compile misc/scripts/tests/test_upstream_cleanup_basis_status.py
          python -m unittest discover -s misc/scripts/tests -p test_upstream_cleanup_basis_status.py -v
