name: Jolt soft-soft edge-edge math and source contracts

on:
  pull_request:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_soft_soft_edge_edge.py"
      - "tests/stress/jolt_soft_soft_edges/**"
      - ".github/workflows/jolt-soft-soft-edge-edge.yml"
  push:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_soft_soft_edge_edge.py"
      - "tests/stress/jolt_soft_soft_edges/**"
      - ".github/workflows/jolt-soft-soft-edge-edge.yml"
  workflow_dispatch:

jobs:
  segment-geometry-and-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test edge-edge geometry, momentum and previous soft-soft contracts
        run: |
          python3 -m unittest \
            tests/stress/test_jolt_soft_soft_edge_edge.py \
            tests/stress/test_jolt_soft_soft_vertex_face.py \
            tests/stress/test_jolt_softsoft_face_bvh.py \
            tests/stress/test_jolt_soft_soft_particle_contacts.py -v
      - name: Check test syntax and Godot fixture
        run: |
          python3 -m py_compile tests/stress/test_jolt_soft_soft_edge_edge.py
          test -f tests/stress/jolt_soft_soft_edges/project.godot
          test -f tests/stress/jolt_soft_soft_edges/edge_edge_regression.gd
