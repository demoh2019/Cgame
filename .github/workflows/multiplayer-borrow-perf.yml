name: Multiplayer replication zero-copy hotpaths

on:
  push:
    branches: [develop]
    paths:
      - 'modules/multiplayer/scene_replication_interface.cpp'
      - 'modules/multiplayer/multiplayer_synchronizer.cpp'
      - 'misc/scripts/tests/test_multiplayer_container_borrows.py'
      - '.github/workflows/multiplayer-borrow-perf.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'modules/multiplayer/scene_replication_interface.cpp'
      - 'modules/multiplayer/multiplayer_synchronizer.cpp'
      - 'misc/scripts/tests/test_multiplayer_container_borrows.py'
      - '.github/workflows/multiplayer-borrow-perf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Container borrow and replication guard regression checks
        run: |
          python -m py_compile misc/scripts/tests/test_multiplayer_container_borrows.py
          python -m unittest discover -s misc/scripts/tests -p test_multiplayer_container_borrows.py -v
