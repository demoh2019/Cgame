name: Albion After cooperative dangerous-zone raid bosses

on:
  pull_request:
    paths:
      - 'game/scripts/**'
      - 'game/tests/**'
      - '.github/workflows/albion-after-raid-boss.yml'
  push:
    branches: [develop]
    paths:
      - 'game/scripts/**'
      - 'game/tests/**'
      - '.github/workflows/albion-after-raid-boss.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raid-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-verified Godot 4.7.2 compatibility editor
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 -fL -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Run canonical game suite including raid encounter tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s ./godot --headless --path game --script res://tests/run_all.gd 2>&1 | tee raid-tests.log
          grep -Fq 'test_raid_encounter.gd' raid-tests.log
          grep -Fq '0 failures' raid-tests.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|Invalid call|FAIL ' raid-tests.log; then
            exit 1
          fi
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: albion-after-raid-tests
          if-no-files-found: ignore
          path: raid-tests.log
