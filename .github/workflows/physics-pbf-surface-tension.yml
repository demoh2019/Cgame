name: Native PBF surface tension and pairwise momentum

on:
  pull_request:
    paths:
      - "servers/physics_pbf_surface_tension_3d.h"
      - "scene/3d/physics/pbf_particle_fluid_3d.cpp"
      - "scene/3d/physics/pbf_particle_fluid_3d.h"
      - "tests/servers/test_physics_pbf_surface_tension_3d.cpp"
      - "tests/stress/test_physics_pbf_surface_tension_3d.py"
      - "tests/stress/test_physics_pbf_surface_tension_compiler.cpp"
      - "tests/stress/physics_pbf_surface_tension_3d_regression.gd"
      - "tests/stress/physics_pbf_particle_fluid_stress.gd"
      - "tests/stress/stress.gd"
      - "tests/stress/run.py"
      - "demo/physics_lab/pbf_water_3d.gd"
      - "doc/classes/PBFParticleFluid3D.xml"
      - ".github/workflows/physics-pbf-surface-tension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile ACTUAL surface tension C++ header with float32 and float64
        shell: bash
        run: |
          set -euo pipefail
          for precision in float double; do
            flags=""
            if [ "$precision" = "double" ]; then flags="-DCGAME_USE_DOUBLE"; fi
            g++ -std=c++17 -O2 -Wall -Wextra -Werror $flags \
              -Itests/stress/physics_pbf_cpp_stubs -I. \
              tests/stress/test_physics_pbf_surface_tension_compiler.cpp \
              -o "/tmp/pbf_surface_tension_$precision"
            "/tmp/pbf_surface_tension_$precision"
          done
      - name: Independent 6000 random cohesion and pair conservation tests
        run: python3 -m unittest discover -s tests/stress -p test_physics_pbf_surface_tension_3d.py -v

  native-surface-fluid:
    # This is a stacked draft PR; the normal whole-engine stress workflow
    # only triggers PRs targeting develop, so build natively HERE.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: surface-reference
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot-deps
      - name: Compile native Cgame GodotPhysics3D editor and doctests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_text_server_fb_enabled=yes -j2
      - name: Native surface cohesion/curvature doctests and momentum integration
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --test --test-case="*[PhysicsPBFSurface]*" \
            --success=true --no-colors 2>&1 | tee pbf-surface-native.log
          grep -Fq '[PhysicsPBFSurface]' pbf-surface-native.log
      - name: Headless 125-particle surface tension and default-off comparison
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --path tests/stress \
            --script res://physics_pbf_surface_tension_3d_regression.gd \
            2>&1 | tee pbf-surface-runtime.log
          grep -Fq 'Native PBF surface tension passed' pbf-surface-runtime.log
      - name: Check surface scenario and stress harness GDScript
        shell: bash
        run: |
          set -euo pipefail
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress \
            --script res://physics_pbf_surface_tension_3d_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress \
            --script res://physics_pbf_particle_fluid_stress.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path demo/physics_lab \
            --script res://smoke_test.gd --check-only
      - name: Compare fully active PBF CPU and RSS with surface stage on/off
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/stress/run.py \
            --godot ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --preset smoke --render-mode headless \
            --case physics_pbf_surface_3d_disabled,physics_pbf_surface_3d_enabled \
            --scale 1 --frames 30 --repeats 1 \
            --output pbf-surface-smoke.json
