name: Image self-blit overlap and zero-allocation regression

on:
  pull_request:
    branches: [develop]
    paths:
      - 'core/io/image.cpp'
      - 'tests/core/io/test_image.cpp'
      - '.github/workflows/image-self-blit-memmove.yml'
  push:
    branches: [develop]
    paths:
      - 'core/io/image.cpp'
      - 'tests/core/io/test_image.cpp'
      - '.github/workflows/image-self-blit-memmove.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-self-blit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Check self-overlap and shared COW image copies
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*Self-blit overlapping rectangles*" --no-colors
