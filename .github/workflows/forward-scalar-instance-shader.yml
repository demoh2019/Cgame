name: Forward+ vertex scalar InstanceData
on:
  pull_request:
    branches: [develop]
    paths: ["servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl", "misc/scripts/tests/test_forward_shader_scalar_instance.py", ".github/workflows/forward-scalar-instance-shader.yml"]
  push:
    branches: [develop]
    paths: ["servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl", "misc/scripts/tests/test_forward_shader_scalar_instance.py", ".github/workflows/forward-scalar-instance-shader.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s misc/scripts/tests -p test_forward_shader_scalar_instance.py -v
  linux-editor-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
