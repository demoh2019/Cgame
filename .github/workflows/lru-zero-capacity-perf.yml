name: LRU zero-capacity allocation regressions

on:
  push:
    branches: [develop]
    paths:
      - 'core/templates/lru.h'
      - 'tests/core/templates/test_lru.cpp'
      - '.github/workflows/lru-zero-capacity-perf.yml'
  pull_request:
    paths:
      - 'core/templates/lru.h'
      - 'tests/core/templates/test_lru.cpp'
      - '.github/workflows/lru-zero-capacity-perf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-lru-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build Cgame editor with native tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Execute LRU native regressions
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[LRU]*" --no-colors
