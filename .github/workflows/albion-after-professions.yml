name: Albion After authoritative professions

on:
  push:
    branches: [develop]
    paths:
      - 'game/**'
      - '.github/workflows/albion-after-professions.yml'
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/albion-after-professions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classless-professions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download checksum-verified baseline Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 -fL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Import game and check parse
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path game --editor --import --quit 2>&1 | tee game-import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' game-import.log; then exit 1; fi
      - name: Run full server gameplay suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s ./godot --headless --path game --script res://tests/run_all.gd 2>&1 | tee game-tests.log
          grep -Fq 'test_progression.gd' game-tests.log
          grep -Eq 'TOTAL [0-9]+ checks, 0 failures' game-tests.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|FAIL ' game-tests.log; then exit 1; fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: albion-after-professions-logs
          if-no-files-found: ignore
          path: |
            game-import.log
            game-tests.log
