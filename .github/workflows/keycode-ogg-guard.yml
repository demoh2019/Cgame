name: Keycode scan and Ogg include performance guards

on:
  push:
    branches: [develop]
    paths:
      - "editor/settings/input_event_configuration_dialog.cpp"
      - "modules/ogg/ogg_packet_sequence.h"
      - "misc/scripts/tests/test_editor_keycode_ogg_guard.py"
      - ".github/workflows/keycode-ogg-guard.yml"
  pull_request:
    paths:
      - "editor/settings/input_event_configuration_dialog.cpp"
      - "modules/ogg/ogg_packet_sequence.h"
      - "misc/scripts/tests/test_editor_keycode_ogg_guard.py"
      - ".github/workflows/keycode-ogg-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s misc/scripts/tests -p test_editor_keycode_ogg_guard.py -v
