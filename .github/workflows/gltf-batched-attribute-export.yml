name: GLTF Batched Attribute Export
on:
  pull_request:
    paths:
      - "modules/gltf/gltf_document.cpp"
      - "tests/scene/test_gltf_document.cpp"
      - "misc/tests/test_gltf_attribute_write_fastpath.py"
      - ".github/workflows/gltf-batched-attribute-export.yml"
  workflow_dispatch:

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s misc/tests -p test_gltf_attribute_write_fastpath.py -v
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: linux-gltf-batched-attribute-export
        continue-on-error: true
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - uses: ./.github/actions/godot-cache-save
        with:
          cache-name: linux-gltf-batched-attribute-export
        continue-on-error: true
      - name: GLTF attribute export roundtrip and existing regressions
        run: ./bin/godot.linuxbsd.editor.x86_64 --headless --test --test-case="*[GLTFAttributeFastPath]*"
