name: Jolt soft-soft face BVH source and geometry contracts

on:
  pull_request:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_softsoft_face_bvh.py"
      - "tests/stress/jolt_soft_soft_bvh/**"
      - ".github/workflows/jolt-softsoft-face-bvh.yml"
  push:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_softsoft_face_bvh.py"
      - "tests/stress/jolt_soft_soft_bvh/**"
      - ".github/workflows/jolt-softsoft-face-bvh.yml"
  workflow_dispatch:

jobs:
  conservative-geometry-and-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate BVH candidate completeness and legacy VF-VV math
        run: |
          python3 -m unittest \
            tests/stress/test_jolt_softsoft_face_bvh.py \
            tests/stress/test_jolt_soft_soft_vertex_face.py \
            tests/stress/test_jolt_soft_soft_particle_contacts.py -v
      - name: Validate fixture and Python syntax
        run: |
          python3 -m py_compile tests/stress/test_jolt_softsoft_face_bvh.py
          test -f tests/stress/jolt_soft_soft_bvh/project.godot
          test -f tests/stress/jolt_soft_soft_bvh/bvh_regression.gd
