name: GodotPhysics3D rotating-reference-frame Boris integration contracts

on:
  pull_request:
    paths:
      - "servers/physics_rotating_frame_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "modules/godot_physics_3d/godot_body_3d.cpp"
      - "tests/servers/test_physics_rotating_frame_3d.cpp"
      - "tests/stress/test_physics_rotating_frame_3d.py"
      - ".github/workflows/physics-rigid-rotating-frame.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_rotating_frame_3d.h"
      - "modules/godot_physics_3d/godot_body_3d.cpp"
      - "tests/stress/test_physics_rotating_frame_3d.py"
      - ".github/workflows/physics-rigid-rotating-frame.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test rotating-frame inertial forces and native wiring contracts
        run: python3 -m unittest discover -s tests/stress -p test_physics_rotating_frame_3d.py -v
