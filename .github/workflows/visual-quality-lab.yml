name: Visual Quality Lab smoke

on:
  pull_request:
    paths:
      - "misc/visual_quality_lab/**"
      - ".github/workflows/visual-quality-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-headless:
    name: Godot 4.6.3 GDScript and package tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Godot 4.6.3 Linux binary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64
          /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64 --headless --version

      - name: Static packaging checks
        shell: bash
        run: python3 -m unittest discover -s misc/visual_quality_lab/tests -p 'test_*.py' -v

      - name: Parse and import GDScript resources
        shell: bash
        working-directory: misc/visual_quality_lab
        run: |
          set -euo pipefail
          /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --editor --import

      - name: GDScript algorithm regressions
        shell: bash
        working-directory: misc/visual_quality_lab
        run: |
          set -euo pipefail
          for script in \
            res://tests/test_adaptive_resolution.gd \
            res://tests/test_quality_manager.gd \
            res://tests/test_atmosphere.gd \
            res://tests/test_foliage.gd \
            res://tests/test_exploration_quest.gd \
            res://tests/test_character.gd \
            res://tests/test_character_physics.gd \
            res://tests/test_world_streamer.gd \
            res://tests/test_world_streamer_runtime.gd \
            res://tests/test_world_state_store.gd \
            res://tests/test_world_state_runtime.gd \
            res://tests/test_streamed_navigation.gd \
            res://tests/test_streamed_navigation_runtime.gd \
            res://tests/test_navigation_obstacles.gd \
            res://tests/test_ai_interest.gd \
            res://tests/test_navigation_obstacles_runtime.gd \
            res://tests/test_world_telemetry.gd \
            res://tests/test_world_budget_governor.gd \
            res://tests/test_streaming_planner.gd \
            res://tests/test_streaming_cell_profiler.gd \
            res://tests/test_predictive_streaming_runtime.gd \
            res://tests/test_world_interaction.gd \
            res://tests/test_world_interaction_runtime.gd \
            res://tests/test_inventory_component.gd \
            res://tests/test_inventory_crafting.gd \
            res://tests/test_inventory_persistence.gd \
            res://tests/test_inventory_gameplay.gd \
            res://tests/test_attributes.gd \
            res://tests/test_abilities.gd \
            res://tests/test_equipment.gd \
            res://tests/test_equipment_persistence.gd \
            res://tests/test_combat_component.gd \
            res://tests/test_combat_selection.gd \
            res://tests/test_hostile_sentry.gd \
            res://tests/test_combat_streaming_runtime.gd; do
            /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --script "$script"
          done

      - name: Load demo scene (headless smoke)
        shell: bash
        working-directory: misc/visual_quality_lab
        run: /tmp/godot-bin/Godot_v4.6.3-stable_linux.x86_64 --headless --path . --quit-after 30
