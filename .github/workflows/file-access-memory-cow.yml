name: FileAccessMemory read-only zero-copy regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - 'core/io/file_access_memory.cpp'
      - 'core/io/file_access_memory.h'
      - 'tests/core/io/test_file_access.cpp'
      - '.github/workflows/file-access-memory-cow.yml'
  push:
    branches: [develop]
    paths:
      - 'core/io/file_access_memory.cpp'
      - 'core/io/file_access_memory.h'
      - 'tests/core/io/test_file_access.cpp'
      - '.github/workflows/file-access-memory-cow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-memory-file-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build engine with native tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Exercise read-only snapshots, writable COW, replacement and empty buffers
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[FileAccess] Memory*"
