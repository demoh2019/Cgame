name: Volumetric tetrahedral FEM numerical and compiler contracts

on:
  push:
    branches: [develop]
    paths:
      - "servers/physics_fem_tetra_neo_hookean.h"
      - "tests/servers/test_physics_fem_tetra_neo_hookean.cpp"
      - "tests/stress/test_physics_fem_tetra_compiler.cpp"
      - "tests/stress/physics_cpp_stubs/core/math/vector3.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - ".github/workflows/physics-fem-tetra.yml"
  pull_request:
    paths:
      - "servers/physics_fem_tetra_neo_hookean.h"
      - "tests/servers/test_physics_fem_tetra_neo_hookean.cpp"
      - "tests/stress/test_physics_fem_tetra_compiler.cpp"
      - "tests/stress/physics_cpp_stubs/core/math/vector3.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - ".github/workflows/physics-fem-tetra.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fem-tetra-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run Neo-Hookean FEM header in float32 and float64
        run: |
          for precision in float double; do
            flags=""
            if [ "$precision" = "double" ]; then flags="-DCGAME_USE_DOUBLE"; fi
            g++ -std=c++17 -O2 -Wall -Wextra -Werror $flags \
              -Itests/stress/physics_cpp_stubs -I. \
              tests/stress/test_physics_fem_tetra_compiler.cpp \
              -o "/tmp/physics_fem_tetra_$precision"
            "/tmp/physics_fem_tetra_$precision"
          done
