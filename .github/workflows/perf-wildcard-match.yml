name: Wildcard matcher correctness and microbenchmark
on:
  push:
    branches: [develop]
    paths:
      - 'core/string/ustring.cpp'
      - 'tests/core/string/test_string.cpp'
      - 'misc/scripts/tests/test_wildcard_match_hotpath.py'
      - '.github/workflows/perf-wildcard-match.yml'
  pull_request:
    paths:
      - 'core/string/ustring.cpp'
      - 'tests/core/string/test_string.cpp'
      - 'misc/scripts/tests/test_wildcard_match_hotpath.py'
      - '.github/workflows/perf-wildcard-match.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wildcard-equivalence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and compile production matcher against actual Unicode tables
        run: |
          python -m py_compile misc/scripts/tests/test_wildcard_match_hotpath.py
          python -m unittest discover -s misc/scripts/tests -p test_wildcard_match_hotpath.py -v
