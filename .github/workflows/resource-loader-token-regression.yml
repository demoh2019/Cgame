name: ResourceLoader threaded token lifetime regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - "core/io/resource_loader.cpp"
      - "tests/core/io/test_resource.cpp"
      - "misc/scripts/tests/test_resource_loader_token_lifetime.py"
      - ".github/workflows/resource-loader-token-regression.yml"
  push:
    branches: [develop]
    paths:
      - "core/io/resource_loader.cpp"
      - "tests/core/io/test_resource.cpp"
      - "misc/scripts/tests/test_resource_loader_token_lifetime.py"
      - ".github/workflows/resource-loader-token-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check source contracts
        run: |
          python3 -m py_compile misc/scripts/tests/test_resource_loader_token_lifetime.py
          python3 -m unittest discover -s misc/scripts/tests -p 'test_resource_loader_token_lifetime.py' -v

  native-threaded-resource:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build editor with doctests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Repeat threaded nested resource loads (24 cases)
        shell: bash
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*Threaded nested loads release task tokens*" --no-colors
