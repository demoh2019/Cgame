name: AI Game Builder tests

on:
  push:
    paths:
      - "misc/ai_game_builder/**"
      - ".github/workflows/ai-game-builder.yml"
  pull_request:
    paths:
      - "misc/ai_game_builder/**"
      - ".github/workflows/ai-game-builder.yml"

permissions:
  contents: read

jobs:
  gdscript-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            misc/ai_game_builder
      - name: Install standalone Godot
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          export-templates: false
      - name: Run headless tests
        run: godot --headless --path misc/ai_game_builder --script res://tests/run.gd

      - name: Smoke-check a real generated Godot scene (CLI integration)
        shell: bash
        run: |
          mkdir -p misc/ai_game_builder/ai_generated
          printf '[gd_scene format=3]\n\n[node name="Main" type="Node2D"]\n' > misc/ai_game_builder/ai_generated/main.tscn
          godot --headless --path misc/ai_game_builder \
            --script res://addons/ai_game_builder/smoke_check.gd \
            -- --report user://ai_game_builder/ci_good.json \
            --paths '["res://ai_generated/main.tscn"]'

      - name: Reject out-of-project paths from CLI manifest
        shell: bash
        run: |
          set +e
          godot --headless --path misc/ai_game_builder \
            --script res://addons/ai_game_builder/smoke_check.gd \
            -- --report user://ai_game_builder/ci_reject.json \
            --paths '["res://project.godot"]'
          code=$?
          set -e
          test "$code" -eq 1

