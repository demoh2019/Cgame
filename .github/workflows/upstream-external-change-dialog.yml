name: External change dialog regression

on:
  pull_request:
    branches: [develop]
    paths:
      - editor/editor_node.cpp
      - editor/editor_node.h
      - misc/scripts/tests/test_upstream_external_change_dialog.py
      - .github/workflows/upstream-external-change-dialog.yml
  push:
    branches: [develop]
    paths:
      - editor/editor_node.cpp
      - editor/editor_node.h
      - misc/scripts/tests/test_upstream_external_change_dialog.py
      - .github/workflows/upstream-external-change-dialog.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-dialog-contracts:
    name: Editor dialog regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check external-change modal lifecycle and callbacks
        run: python -m unittest discover -s misc/scripts/tests -p test_upstream_external_change_dialog.py -v
