name: Jolt soft-body radial elasticity contracts

on:
  pull_request:
    branches: [develop]
    paths:
      - "modules/jolt_physics/objects/jolt_soft_body_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_softbody_radial.py"
      - "tests/stress/jolt_radial/**"
      - ".github/workflows/jolt-softbody-radial-elasticity.yml"
  push:
    branches: [develop]
    paths:
      - "modules/jolt_physics/objects/jolt_soft_body_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_softbody_radial.py"
      - "tests/stress/jolt_radial/**"
      - ".github/workflows/jolt-softbody-radial-elasticity.yml"
  workflow_dispatch:

jobs:
  radial-source-and-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run elastic radial reference and source-contract tests
        run: python3 -m unittest tests/stress/test_jolt_softbody_radial.py -v
      - name: Verify Python syntax and Godot scene files
        run: |
          python3 -m py_compile tests/stress/test_jolt_softbody_radial.py
          test -f tests/stress/jolt_radial/project.godot
          test -f tests/stress/jolt_radial/radial_elasticity_regression.gd
