name: Physics Lab 2D and 3D scene smoke

on:
  pull_request:
    paths:
      - 'demo/physics_lab/**'
      - '.github/workflows/physics-lab-smoke.yml'
  push:
    branches: [develop]
    paths:
      - 'demo/physics_lab/**'
      - '.github/workflows/physics-lab-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-physics-lab-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify official Godot 4.7.2 test editor
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 -fL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum --check --status
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          ./godot --version
      - name: Import scene project and parse scripts
        shell: bash
        run: |
          set -o pipefail
          ./godot --headless --path demo/physics_lab --editor --import --quit 2>&1 | tee godot-import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' godot-import.log; then
            exit 1
          fi
      - name: Run real physics steps and interaction smoke
        shell: bash
        run: |
          set -o pipefail
          timeout 120s ./godot --headless --path demo/physics_lab --script res://smoke_test.gd 2>&1 | tee physics-lab.log
          grep -F 'PASS: both Cgame physics labs' physics-lab.log
          if grep -E 'SCRIPT ERROR:|Parse Error:' physics-lab.log; then
            exit 1
          fi
      - name: Upload scene logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-lab-smoke-logs
          path: |
            godot-import.log
            physics-lab.log
          if-no-files-found: ignore
