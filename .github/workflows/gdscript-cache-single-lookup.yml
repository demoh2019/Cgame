name: GDScript cache single-probe regressions

on:
  push:
    branches: [develop]
    paths:
      - 'modules/gdscript/gdscript_cache.cpp'
      - 'modules/gdscript/tests/test_gdscript_cache_hotpath.cpp'
      - '.github/workflows/gdscript-cache-single-lookup.yml'
  pull_request:
    paths:
      - 'modules/gdscript/gdscript_cache.cpp'
      - 'modules/gdscript/tests/test_gdscript_cache_hotpath.cpp'
      - '.github/workflows/gdscript-cache-single-lookup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-gdscript-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build editor with native GDScript cache regressions
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Run GDScript parser and script cache hotpath checks
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[GDScriptCacheHotpath]*" --no-colors
