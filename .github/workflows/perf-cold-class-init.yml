name: Cold GDCLASS initialization build and regression tests
on:
  push:
    branches: [develop]
    paths:
      - 'core/object/object.h'
      - 'core/typedefs.h'
      - 'main/main.h'
      - 'tests/core/object/test_object.cpp'
      - 'misc/scripts/tests/test_class_cold_init_source.py'
      - 'misc/scripts/README_perf_cold_class_init.md'
      - '.github/workflows/perf-cold-class-init.yml'
  pull_request:
    paths:
      - 'core/object/object.h'
      - 'core/typedefs.h'
      - 'main/main.h'
      - 'tests/core/object/test_object.cpp'
      - 'misc/scripts/tests/test_class_cold_init_source.py'
      - 'misc/scripts/README_perf_cold_class_init.md'
      - '.github/workflows/perf-cold-class-init.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check cold initialization contracts
        run: |
          python -m py_compile misc/scripts/tests/test_class_cold_init_source.py
          python -m unittest discover -s misc/scripts/tests -p test_class_cold_init_source.py -v
  linux-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Compile Godot editor + tests with GCC
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Run class initialization regressions
        run: |
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --force-colors
