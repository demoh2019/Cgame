name: RingBuffer wrapped hot-path native regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - "core/templates/ring_buffer.h"
      - "tests/core/templates/test_ring_buffer.cpp"
      - ".github/workflows/ring-buffer-hotpath.yml"
  push:
    branches: [develop]
    paths:
      - "core/templates/ring_buffer.h"
      - "tests/core/templates/test_ring_buffer.cpp"
      - ".github/workflows/ring-buffer-hotpath.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ring-buffer:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Run native RingBuffer cases
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[RingBuffer]*" --no-colors
