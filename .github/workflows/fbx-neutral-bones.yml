name: FBX neutral bone importer regression

on:
  pull_request:
    paths:
      - "modules/fbx/fbx_document.cpp"
      - "modules/fbx/fbx_document.h"
      - "misc/scripts/tests/test_fbx_neutral_bones.py"
      - ".github/workflows/fbx-neutral-bones.yml"
  push:
    branches: [develop]
    paths:
      - "modules/fbx/fbx_document.cpp"
      - "modules/fbx/fbx_document.h"
      - "misc/scripts/tests/test_fbx_neutral_bones.py"
      - ".github/workflows/fbx-neutral-bones.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neutral-bone-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise actual FBX weight assignment (4/8 weights)
        run: |
          python3 -m py_compile misc/scripts/tests/test_fbx_neutral_bones.py
          CXX=${{ matrix.compiler }} python3 -m unittest discover -s misc/scripts/tests -p 'test_fbx_neutral_bones.py' -v

  native-editor-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Compile editor and FBX importer
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
