name: IPAddress single-allocation formatting regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - 'core/io/ip_address.cpp'
      - 'tests/core/io/test_ip_address.cpp'
      - '.github/workflows/perf-ip-address-format.yml'
  push:
    branches: [develop]
    paths:
      - 'core/io/ip_address.cpp'
      - 'tests/core/io/test_ip_address.cpp'
      - '.github/workflows/perf-ip-address-format.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-ip-address:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build Cgame editor and native tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Verify IPv4 and IPv6 formatting roundtrips
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          "$BIN" --headless --test --test-case="*[IPAddress]*" --no-colors
