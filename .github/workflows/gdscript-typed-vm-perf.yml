name: GDScript typed container VM fast-path regression

on:
  push:
    branches: [develop]
    paths:
      - 'modules/gdscript/gdscript_vm.cpp'
      - 'modules/gdscript/tests/scripts/runtime/features/typed_container_vm_fastpath.gd'
      - 'modules/gdscript/tests/scripts/runtime/features/typed_container_vm_fastpath.out'
      - 'misc/scripts/tests/test_gdscript_typed_vm_perf.py'
      - '.github/workflows/gdscript-typed-vm-perf.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'modules/gdscript/gdscript_vm.cpp'
      - 'modules/gdscript/tests/scripts/runtime/features/typed_container_vm_fastpath.gd'
      - 'modules/gdscript/tests/scripts/runtime/features/typed_container_vm_fastpath.out'
      - 'misc/scripts/tests/test_gdscript_typed_vm_perf.py'
      - '.github/workflows/gdscript-typed-vm-perf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate typed container VM source and runtime fixtures
        run: |
          python -m py_compile misc/scripts/tests/test_gdscript_typed_vm_perf.py
          python -m unittest discover -s misc/scripts/tests -p test_gdscript_typed_vm_perf.py -v
