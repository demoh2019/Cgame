name: PagedAllocator metadata growth regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - "core/templates/paged_allocator.h"
      - "tests/core/templates/test_paged_allocator.cpp"
      - ".github/workflows/paged-allocator-metadata.yml"
  push:
    branches: [develop]
    paths:
      - "core/templates/paged_allocator.h"
      - "tests/core/templates/test_paged_allocator.cpp"
      - ".github/workflows/paged-allocator-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-paged-allocator:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Run native PagedAllocator tests
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[PagedAllocator]*" --no-colors
