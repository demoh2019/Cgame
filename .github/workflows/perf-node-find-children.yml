name: Node find_children single-array performance regression

on:
  pull_request:
    paths:
      - "scene/main/node.cpp"
      - "scene/main/node.h"
      - "tests/scene/test_node_find_children_fast.cpp"
      - "misc/scripts/tests/test_node_find_children_fast.py"
      - ".github/workflows/perf-node-find-children.yml"
  push:
    branches: [develop]
    paths:
      - "scene/main/node.cpp"
      - "scene/main/node.h"
      - "tests/scene/test_node_find_children_fast.cpp"
      - "misc/scripts/tests/test_node_find_children_fast.py"
      - ".github/workflows/perf-node-find-children.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run source contracts
        run: python -m unittest discover -s misc/scripts/tests -p 'test_node_find_children_fast.py' -v

  native-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin
      - uses: ./.github/actions/godot-deps
      - name: Build Cgame editor and native tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes debug_symbols=no tests=yes module_text_server_fb_enabled=yes -j2
      - name: Run Node find_children regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-suite="*[NodeFindChildrenFast]*" --no-colors
