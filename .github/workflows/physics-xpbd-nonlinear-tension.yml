name: XPBD SoftBody nonlinear tensile hardening contracts

on:
  push:
    branches: [develop]
    paths:
      - "servers/physics_xpbd_tension_hardening.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_xpbd_tension_hardening.cpp"
      - "tests/stress/test_physics_xpbd_tension_hardening.py"
      - ".github/workflows/physics-xpbd-nonlinear-tension.yml"
  pull_request:
    paths:
      - "servers/physics_xpbd_tension_hardening.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_xpbd_tension_hardening.cpp"
      - "tests/stress/test_physics_xpbd_tension_hardening.py"
      - ".github/workflows/physics-xpbd-nonlinear-tension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hardening convergence and source wiring contracts
        run: python3 -m unittest discover -s tests/stress -p 'test_physics_xpbd_tension_hardening.py' -v
