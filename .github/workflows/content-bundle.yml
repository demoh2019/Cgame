name: Content bundle regression tests

on:
  push:
    paths:
      - 'misc/scripts/content_bundle.py'
      - 'misc/scripts/content_manifest.py'
      - 'misc/scripts/tests/test_content_bundle.py'
      - 'misc/scripts/README_content_bundle.md'
      - '.github/workflows/content-bundle.yml'
  pull_request:
    paths:
      - 'misc/scripts/content_bundle.py'
      - 'misc/scripts/content_manifest.py'
      - 'misc/scripts/tests/test_content_bundle.py'
      - 'misc/scripts/README_content_bundle.md'
      - '.github/workflows/content-bundle.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m py_compile misc/scripts/content_bundle.py misc/scripts/tests/test_content_bundle.py
          python -m unittest discover -s misc/scripts/tests -p test_content_bundle.py -v
