name: Upstream advanced text iterator stack regressions
on:
  push:
    branches: [develop]
    paths:
      - 'modules/text_server_adv/script_iterator.cpp'
      - 'misc/scripts/tests/test_upstream_text_iterator_stacks.py'
      - 'misc/scripts/README_upstream_text_iterator_stacks.md'
      - '.github/workflows/upstream-text-iterator-stacks.yml'
  pull_request:
    paths:
      - 'modules/text_server_adv/script_iterator.cpp'
      - 'misc/scripts/tests/test_upstream_text_iterator_stacks.py'
      - 'misc/scripts/README_upstream_text_iterator_stacks.md'
      - '.github/workflows/upstream-text-iterator-stacks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Source regression tests
        run: |
          python -m py_compile misc/scripts/tests/test_upstream_text_iterator_stacks.py
          python -m unittest discover -s misc/scripts/tests -p test_upstream_text_iterator_stacks.py -v
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Compile engine and text server with tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Run native engine tests
        run: |
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --force-colors
