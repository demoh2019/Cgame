name: Editor CI runner regression tests
on:
  push:
    paths:
      - 'misc/scripts/editor_ci_runner.py'
      - 'misc/scripts/tests/test_editor_ci_runner.py'
      - 'misc/scripts/README_editor_ci_runner.md'
      - '.github/workflows/editor-ci-runner.yml'
  pull_request:
    paths:
      - 'misc/scripts/editor_ci_runner.py'
      - 'misc/scripts/tests/test_editor_ci_runner.py'
      - 'misc/scripts/README_editor_ci_runner.md'
      - '.github/workflows/editor-ci-runner.yml'
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify CLI syntax and run offline regression cases
        run: |
          python -m py_compile misc/scripts/editor_ci_runner.py misc/scripts/tests/test_editor_ci_runner.py
          python -m unittest discover -s misc/scripts/tests -p test_editor_ci_runner.py -v
