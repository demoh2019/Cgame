name: Asset audit script tests

on:
  pull_request:
    paths:
      - 'misc/scripts/asset_audit.py'
      - 'misc/scripts/tests/test_asset_audit.py'
      - 'misc/scripts/ASSET_AUDIT.md'
      - '.github/workflows/asset-audit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-audit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test resource path checker
        run: python3 -m unittest discover -s misc/scripts/tests -p 'test_asset_audit.py' -v
