name: Asset audit script tests

on:
  push:
    branches: [develop]
    paths:
      - 'misc/scripts/asset_audit.py'
      - 'misc/scripts/tests/test_asset_audit.py'
      - 'misc/scripts/ASSET_AUDIT.md'
      - '.github/workflows/asset-audit-tests.yml'
  pull_request:
    paths:
      - 'misc/scripts/asset_audit.py'
      - 'misc/scripts/tests/test_asset_audit.py'
      - 'misc/scripts/ASSET_AUDIT.md'
      - '.github/workflows/asset-audit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-audit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile asset checker and tests
        run: python -m py_compile misc/scripts/asset_audit.py misc/scripts/tests/test_asset_audit.py
      - name: Run 64 asset preflight regression tests
        run: python -m unittest discover -s misc/scripts/tests -p 'test_asset_audit.py' -v
