name: ValuePtr signal memory reduction regressions

on:
  push:
    branches: [develop]
    paths:
      - "core/object/object.cpp"
      - "core/object/object.h"
      - "core/templates/value_ptr.h"
      - "tests/core/object/test_object.cpp"
      - "misc/scripts/tests/test_signal_metadata_value_ptr.py"
      - ".github/workflows/signal-metadata-valueptr.yml"
  pull_request:
    paths:
      - "core/object/object.cpp"
      - "core/object/object.h"
      - "core/templates/value_ptr.h"
      - "tests/core/object/test_object.cpp"
      - "misc/scripts/tests/test_signal_metadata_value_ptr.py"
      - ".github/workflows/signal-metadata-valueptr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pointer-ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual ValuePtr with GCC and check 10k deep-copy/move lifetimes
        run: |
          python3 -m py_compile misc/scripts/tests/test_signal_metadata_value_ptr.py
          CXX=g++ python3 -m unittest discover -s misc/scripts/tests -p 'test_signal_metadata_value_ptr.py' -v
      - name: Verify the same behavior with Clang
        run: CXX=clang++ python3 -m unittest discover -s misc/scripts/tests -p test_signal_metadata_value_ptr.py -v

  native-object-signals:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Compile native editor tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Run signal and optional metadata native tests
        run: |
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[Object] Signals*"
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[Object] ValuePtr*"
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[Object] Rare user signal*"
