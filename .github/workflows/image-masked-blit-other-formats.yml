name: Image non-RGBA8 masked blit batching regression

on:
  pull_request:
    branches: [develop]
    paths:
      - 'core/io/image.cpp'
      - 'tests/core/io/test_image.cpp'
      - '.github/workflows/image-masked-blit-other-formats.yml'
  push:
    branches: [develop]
    paths:
      - 'core/io/image.cpp'
      - 'tests/core/io/test_image.cpp'
      - '.github/workflows/image-masked-blit-other-formats.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-non-rgba-mask:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Compare batched masked copies with scalar image reference
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*Masked blits batch non-RGBA8*" --no-colors
