name: C# Mathf BCL intrinsic performance regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - "modules/mono/glue/GodotSharp/GodotSharp/Core/Mathf.cs"
      - "misc/scripts/tests/test_csharp_mathf_intrinsics.py"
      - ".github/workflows/csharp-mathf-intrinsics.yml"
  push:
    branches: [develop]
    paths:
      - "modules/mono/glue/GodotSharp/GodotSharp/Core/Mathf.cs"
      - "misc/scripts/tests/test_csharp_mathf_intrinsics.py"
      - ".github/workflows/csharp-mathf-intrinsics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate six intrinsic functions and exact overloads
        run: |
          python3 -m py_compile misc/scripts/tests/test_csharp_mathf_intrinsics.py
          python3 -m unittest discover -s misc/scripts/tests -p test_csharp_mathf_intrinsics.py -v

  dotnet-math-api-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.100
      - name: Verify NET 10 BCL intrinsics in float/double
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/math-intrinsics"
          cat > "$RUNNER_TEMP/math-intrinsics/math-intrinsics.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework></PropertyGroup></Project>
          EOF
          cat > "$RUNNER_TEMP/math-intrinsics/Program.cs" <<'EOF'
          using System;
          if (MathF.Abs(float.DegreesToRadians(180f) - MathF.PI) > 0.00001f) throw new Exception("float deg");
          if (Math.Abs(double.DegreesToRadians(180d) - Math.PI) > 1e-12) throw new Exception("double deg");
          if (MathF.Abs(float.RadiansToDegrees(MathF.PI) - 180f) > 0.001f) throw new Exception("float rad");
          if (Math.Abs(double.RadiansToDegrees(Math.PI) - 180d) > 1e-9) throw new Exception("double rad");
          if (MathF.Abs(float.Lerp(0f, 10f, .25f) - 2.5f) > 1e-6f) throw new Exception("float lerp");
          if (Math.Abs(double.Lerp(0d, 10d, .25d) - 2.5d) > 1e-12) throw new Exception("double lerp");
          Console.WriteLine("intrinsic smoke passed");
          EOF
          dotnet run --project "$RUNNER_TEMP/math-intrinsics/math-intrinsics.csproj" -c Release
