name: Native weighted non-repeating audio and Albion After

on:
  pull_request:
    paths:
      - 'modules/weighted_selection/**'
      - 'game/scripts/client/audio.gd'
      - 'game/scripts/client/audio_variants.gd'
      - 'game/tests/test_audio_parity.gd'
      - 'game/docs/ENGINE_WEIGHTED_NONREPEATING_AUDIO.md'
      - '.github/workflows/native-weighted-audio-variants.yml'
  push:
    branches: [develop]
    paths:
      - 'modules/weighted_selection/**'
      - 'game/scripts/client/audio.gd'
      - 'game/scripts/client/audio_variants.gd'
      - 'game/tests/test_audio_parity.gd'
      - 'game/docs/ENGINE_WEIGHTED_NONREPEATING_AUDIO.md'
      - '.github/workflows/native-weighted-audio-variants.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-weighted-audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot-deps
      - name: Build custom engine with native doctests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - name: Native weighted selection tests
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 180s "$BIN" --headless --test --test-case="[WeightedChoiceTable]*" --no-colors 2>&1 | tee weighted-choice-native.log
      - name: Import and test Albion After
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee weighted-audio-import.log
          timeout 180s "$BIN" --headless --path game --script res://tests/run_audio.gd 2>&1 | tee weighted-audio-focused.log
          grep -E '^AUDIO TOTAL [0-9]+ checks, 0 failures$' weighted-audio-focused.log
          timeout 360s "$BIN" --headless --path game --script res://tests/run_all.gd 2>&1 | tee weighted-audio-all.log
          grep -E '^TOTAL [0-9]+ checks, 0 failures$' weighted-audio-all.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' weighted-audio-import.log weighted-audio-focused.log weighted-audio-all.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-weighted-audio
          if-no-files-found: ignore
          path: |
            weighted-choice-native.log
            weighted-audio-import.log
            weighted-audio-focused.log
            weighted-audio-all.log
