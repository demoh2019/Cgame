name: Cgame native spatial point grid and Albion After AI regression

on:
  pull_request:
    paths:
      - 'scene/main/spatial_point_grid_2d.*'
      - 'scene/register_scene_types.cpp'
      - 'tests/scene/test_spatial_point_grid_2d.cpp'
      - 'game/scripts/server/game_server.gd'
      - 'game/tests/test_player_presence_grid.gd'
      - '.github/workflows/native-spatial-point-grid.yml'
  push:
    branches: [develop]
    paths:
      - 'scene/main/spatial_point_grid_2d.*'
      - 'scene/register_scene_types.cpp'
      - 'tests/scene/test_spatial_point_grid_2d.cpp'
      - 'game/scripts/server/game_server.gd'
      - 'game/tests/test_player_presence_grid.gd'
      - '.github/workflows/native-spatial-point-grid.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-spatial-query:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Cgame build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin
      - uses: ./.github/actions/godot-deps
      - name: Build native Cgame with unit tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_text_server_fb_enabled=yes -j2
      - name: Validate native grid API and strict/inclusive queries
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          "$BIN" --version
          timeout 180s "$BIN" --headless --test --test-case="[SpatialPointGrid2D]*" --no-colors 2>&1 | tee native-grid-tests.log
      - name: Import and verify authoritative Albion After game
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee native-grid-import.log
          timeout 360s "$BIN" --headless --path game --script res://tests/run_all.gd 2>&1 | tee native-grid-game-tests.log
          grep -E '^TOTAL [0-9]+ checks, 0 failures$' native-grid-game-tests.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' native-grid-import.log native-grid-game-tests.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-spatial-point-grid-logs
          if-no-files-found: ignore
          path: |
            native-grid-tests.log
            native-grid-import.log
            native-grid-game-tests.log
