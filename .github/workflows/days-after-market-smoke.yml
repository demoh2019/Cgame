name: Days After market integration smoke

on:
  pull_request:
    paths:
      - 'demo/days_after/**'
      - '.github/workflows/days-after-market-smoke.yml'
  push:
    paths:
      - 'demo/days_after/**'
      - '.github/workflows/days-after-market-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download official Godot 4.8 beta4 for script-level compatibility
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 \
            https://github.com/godotengine/godot-builds/releases/download/4.8-beta4/Godot_v4.8-beta4_linux.x86_64.zip \
            -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.8-beta4_linux.x86_64
      - name: Import and run gameplay and trade smoke tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT=./Godot_v4.8-beta4_linux.x86_64
          "$GODOT" --headless --path demo/days_after --editor --import --quit 2>&1 | tee import.log
          "$GODOT" --headless --path demo/days_after --script res://smoke_test.gd 2>&1 | tee gameplay.log
          "$GODOT" --headless --path demo/days_after --script res://smoke_test_trade.gd 2>&1 | tee trade.log
          grep -F 'PASS:' gameplay.log
          grep -F 'PASS: Days After transactional offline trader' trade.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource' import.log gameplay.log trade.log; then
            exit 1
          fi
