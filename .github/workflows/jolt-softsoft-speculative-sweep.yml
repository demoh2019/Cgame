name: Jolt soft-soft speculative linear sweep regression

on:
  pull_request:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_soft_soft_speculative_ccd.py"
      - "tests/stress/jolt_soft_soft_sweep/**"
      - ".github/workflows/jolt-softsoft-speculative-sweep.yml"
  push:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_soft_soft_speculative_ccd.py"
      - "tests/stress/jolt_soft_soft_sweep/**"
      - ".github/workflows/jolt-softsoft-speculative-sweep.yml"
  workflow_dispatch:

jobs:
  swept-moving-triangle-math:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reference sweep, barycentric and legacy physics contracts
        run: |
          python3 -m unittest \
            tests/stress/test_jolt_soft_soft_speculative_ccd.py \
            tests/stress/test_jolt_soft_soft_edge_edge.py \
            tests/stress/test_jolt_soft_soft_vertex_face.py \
            tests/stress/test_jolt_softsoft_face_bvh.py \
            tests/stress/test_jolt_soft_soft_particle_contacts.py -v
      - name: Verify test script syntax and native fixture
        run: |
          python3 -m py_compile tests/stress/test_jolt_soft_soft_speculative_ccd.py
          test -f tests/stress/jolt_soft_soft_sweep/project.godot
          test -f tests/stress/jolt_soft_soft_sweep/swept_triangle_regression.gd
