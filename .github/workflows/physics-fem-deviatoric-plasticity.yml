name: FEM tetra deviatoric plasticity physical contracts

on:
  pull_request:
    paths:
      - "servers/physics_fem_tetra_deviatoric_plasticity.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_fem_tetra_deviatoric_plasticity.cpp"
      - "tests/stress/test_physics_fem_tetra_deviatoric_plasticity.py"
      - ".github/workflows/physics-fem-deviatoric-plasticity.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_fem_tetra_deviatoric_plasticity.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/stress/test_physics_fem_tetra_deviatoric_plasticity.py"
      - ".github/workflows/physics-fem-deviatoric-plasticity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plastic volume, objectivity, hardening and code wiring
        run: python3 -m unittest discover -s tests/stress -p test_physics_fem_tetra_deviatoric_plasticity.py -v
