name: FEM tetra shear hardening contracts

on:
  pull_request:
    paths:
      - "servers/physics_fem_tetra_deviatoric_plasticity.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_fem_tetra_shear_hardening.cpp"
      - "tests/stress/test_physics_fem_tetra_shear_hardening.py"
      - ".github/workflows/physics-fem-shear-hardening.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_fem_tetra_deviatoric_plasticity.h"
      - "tests/stress/test_physics_fem_tetra_shear_hardening.py"
      - ".github/workflows/physics-fem-shear-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check work-hardening and determinant contracts
        run: python3 -m unittest discover -s tests/stress -p test_physics_fem_tetra_shear_hardening.py -v
