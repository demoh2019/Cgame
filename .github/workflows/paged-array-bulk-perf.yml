name: PagedArray bulk-clear and merge regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - 'core/templates/paged_array.h'
      - 'tests/core/templates/test_paged_array.cpp'
      - '.github/workflows/paged-array-bulk-perf.yml'
  push:
    branches: [develop]
    paths:
      - 'core/templates/paged_array.h'
      - 'tests/core/templates/test_paged_array.cpp'
      - '.github/workflows/paged-array-bulk-perf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-paged-array:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build native engine tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Run paged and binned container doctest cases
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          "$BIN" --headless --test --test-case="*[PagedArray]*" --no-colors
          "$BIN" --headless --test --test-case="*[BinSortedArray]*" --no-colors
