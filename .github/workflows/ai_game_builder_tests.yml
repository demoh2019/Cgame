name: AI Game Builder tests

on:
  pull_request:
    paths:
      - 'misc/ai_game_builder/**'
      - '.github/workflows/ai_game_builder_tests.yml'
  workflow_dispatch:

jobs:
  godot-addon-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download tested Godot 4.6 editor
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6-stable_linux.x86_64
      - name: Run addon parser and policy tests
        run: |
          /tmp/godot/Godot_v4.6-stable_linux.x86_64 --headless --path misc/ai_game_builder --script res://tests/test_ai_changes.gd
      - name: Run safe file-apply tests
        run: |
          /tmp/godot/Godot_v4.6-stable_linux.x86_64 --headless --path misc/ai_game_builder --script res://tests/test_apply.gd
      - name: Parse editor plugin in editor mode
        run: |
          /tmp/godot/Godot_v4.6-stable_linux.x86_64 --headless --editor --path misc/ai_game_builder --import --quit
