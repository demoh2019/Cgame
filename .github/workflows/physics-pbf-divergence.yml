name: Native PBF velocity divergence correction

on:
  pull_request:
    paths:
      - "servers/physics_pbf_divergence_3d.h"
      - "scene/3d/physics/pbf_particle_fluid_3d.h"
      - "scene/3d/physics/pbf_particle_fluid_3d.cpp"
      - "tests/servers/test_physics_pbf_divergence_3d.cpp"
      - "tests/stress/test_physics_pbf_divergence_3d.py"
      - "tests/stress/test_physics_pbf_divergence_compiler.cpp"
      - "tests/stress/physics_pbf_divergence_3d_regression.gd"
      - "tests/stress/physics_pbf_particle_fluid_stress.gd"
      - "tests/stress/stress.gd"
      - "tests/stress/run.py"
      - "demo/physics_lab/pbf_water_3d.gd"
      - "doc/classes/PBFParticleFluid3D.xml"
      - ".github/workflows/physics-pbf-divergence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathematical-and-header-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the REAL C++ divergence kernel in float32 and float64
        shell: bash
        run: |
          set -euo pipefail
          for precision in float double; do
            flags=""
            if [ "$precision" = "double" ]; then flags="-DCGAME_USE_DOUBLE"; fi
            g++ -std=c++17 -O2 -Wall -Wextra -Werror $flags \
              -Itests/stress/physics_pbf_cpp_stubs -I. \
              tests/stress/test_physics_pbf_divergence_compiler.cpp \
              -o "/tmp/pbf_divergence_$precision"
            "/tmp/pbf_divergence_$precision"
          done
      - name: Independent 5000 random particle pair and compression reference tests
        run: python3 -m unittest discover -s tests/stress -p test_physics_pbf_divergence_3d.py -v

  native-fluid-simulation:
    # This stacked PR targets another draft feature branch rather than
    # develop, so its own workflow MUST build the full engine explicitly.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: mathematical-and-header-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot-deps
      - name: Build native GodotPhysics3D with the PBF liquid scene node
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_text_server_fb_enabled=yes -j2
      - name: Native PBF velocity projection and deterministic liquid doctests
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --test --test-case="*[PhysicsPBFDivergence]*" \
            --success=true --no-colors 2>&1 | tee pbf-divergence-native.log
          grep -Fq '[PhysicsPBFDivergence]' pbf-divergence-native.log
      - name: Headless native PBF on/off velocity-divergence and brute-force residual
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --path tests/stress \
            --script res://physics_pbf_divergence_3d_regression.gd \
            2>&1 | tee pbf-divergence-runtime.log
          grep -Fq 'Native PBF divergence passed' pbf-divergence-runtime.log
      - name: Verify PBF stress and scene test script syntax
        shell: bash
        run: |
          set -euo pipefail
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress \
            --script res://physics_pbf_divergence_3d_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress \
            --script res://physics_pbf_particle_fluid_stress.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path demo/physics_lab \
            --script res://smoke_test.gd --check-only
      - name: Compare identical active fluid workloads with velocity projection toggled
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/stress/run.py \
            --godot ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --preset smoke --render-mode headless \
            --case physics_pbf_divergence_3d_disabled,physics_pbf_divergence_3d_enabled \
            --scale 1 --frames 30 --repeats 1 \
            --output pbf-divergence-smoke.json
