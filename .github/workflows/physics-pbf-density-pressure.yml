name: Native PBF predictive density pressure

on:
  pull_request:
    paths:
      - "servers/physics_pbf_density_pressure_3d.h"
      - "scene/3d/physics/pbf_particle_fluid_3d.cpp"
      - "scene/3d/physics/pbf_particle_fluid_3d.h"
      - "tests/servers/test_physics_pbf_density_pressure_3d.cpp"
      - "tests/stress/test_physics_pbf_density_pressure_3d.py"
      - "tests/stress/test_physics_pbf_density_pressure_compiler.cpp"
      - "tests/stress/physics_pbf_density_pressure_3d_regression.gd"
      - "tests/stress/physics_pbf_particle_fluid_stress.gd"
      - "tests/stress/stress.gd"
      - "tests/stress/run.py"
      - "demo/physics_lab/pbf_water_3d.gd"
      - "doc/classes/PBFParticleFluid3D.xml"
      - ".github/workflows/physics-pbf-density-pressure.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mathematical-and-header-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual Cgame predictive-density helper for float32 and float64
        shell: bash
        run: |
          set -euo pipefail
          for precision in float double; do
            flags=""
            if [ "$precision" = "double" ]; then flags="-DCGAME_USE_DOUBLE"; fi
            g++ -std=c++17 -O2 -Wall -Wextra -Werror $flags \
              -Itests/stress/physics_pbf_cpp_stubs -I. \
              tests/stress/test_physics_pbf_density_pressure_compiler.cpp \
              -o "/tmp/pbf_density_pressure_$precision"
            "/tmp/pbf_density_pressure_$precision"
          done
      - name: Independent brute-force predictive SPH pressure and conservation tests
        run: python3 -m unittest discover -s tests/stress -p test_physics_pbf_density_pressure_3d.py -v

  native-fluid-and-density-pressure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: mathematical-and-header-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot-deps
      - name: Build full GodotPhysics3D editor with native PBF
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_text_server_fb_enabled=yes -j2
      - name: Native density pressure C++ doctests
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --test --test-case="*[PhysicsPBFDensityPressure]*" \
            --success=true --no-colors 2>&1 | tee pbf-density-pressure-native.log
          grep -Fq '[PhysicsPBFDensityPressure]' pbf-density-pressure-native.log
      - name: Headless original PBF versus predicted-pressure and deterministic replica
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --path tests/stress \
            --script res://physics_pbf_density_pressure_3d_regression.gd \
            2>&1 | tee pbf-density-pressure-headless.log
          grep -Fq 'Native PBF predictive density pressure passed' pbf-density-pressure-headless.log
      - name: Native fluid scene and stress script parse checks
        shell: bash
        run: |
          set -euo pipefail
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress \
            --script res://physics_pbf_density_pressure_3d_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress \
            --script res://physics_pbf_particle_fluid_stress.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path demo/physics_lab \
            --script res://smoke_test.gd --check-only
      - name: Identical active fluid pressure predictor on/off CPU baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/stress/run.py \
            --godot ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --preset smoke --render-mode headless \
            --case physics_pbf_density_pressure_3d_disabled,physics_pbf_density_pressure_3d_enabled \
            --scale 1 --frames 30 --repeats 1 \
            --output pbf-density-pressure-smoke.json
