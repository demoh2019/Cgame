name: Netcode prediction regression tests

on:
  pull_request:
    paths:
      - "misc/netcode/**"
      - ".github/workflows/netcode-prediction-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-headless-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1 stable test runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            --output /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/
          install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Run prediction and reconciliation GDScript tests
        run: |
          set -euo pipefail
          godot --headless --path misc/netcode \
            --script res://tests/run_tests.gd

      - name: Verify import and parse all demo scripts
        run: |
          godot --headless --path misc/netcode \
            --editor --import --quit
