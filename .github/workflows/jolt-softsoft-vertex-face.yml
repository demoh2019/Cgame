name: Jolt soft-soft vertex-face source and geometry contracts

on:
  pull_request:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_soft_soft_vertex_face.py"
      - "tests/stress/jolt_soft_soft_vertex_face/**"
      - ".github/workflows/jolt-softsoft-vertex-face.yml"
  push:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_soft_soft_vertex_face.py"
      - "tests/stress/jolt_soft_soft_vertex_face/**"
      - ".github/workflows/jolt-softsoft-vertex-face.yml"
  workflow_dispatch:

jobs:
  barycentric-geometry-and-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check triangle nearest-point regions and barycentric impulse contracts
        run: python3 -m unittest tests/stress/test_jolt_soft_soft_vertex_face.py tests/stress/test_jolt_soft_soft_particle_contacts.py -v
      - name: Validate Python syntax and native scene assets
        run: |
          python3 -m py_compile tests/stress/test_jolt_soft_soft_vertex_face.py
          test -f tests/stress/jolt_soft_soft_vertex_face/project.godot
          test -f tests/stress/jolt_soft_soft_vertex_face/vertex_face_regression.gd
