name: String bounded float token parsing regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - 'core/string/ustring.cpp'
      - 'tests/core/string/test_string.cpp'
      - '.github/workflows/string-bounded-float-perf.yml'
  push:
    branches: [develop]
    paths:
      - 'core/string/ustring.cpp'
      - 'tests/core/string/test_string.cpp'
      - '.github/workflows/string-bounded-float-perf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-string-splitting:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build native engine tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Run String splitting tests
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          "$BIN" --headless --test --test-case="*[String] split*" --no-colors
