name: Editor replace-all batched results regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - "editor/script/find_in_files.cpp"
      - "editor/script/find_in_files.h"
      - "misc/scripts/tests/test_replace_all_batch_ui.py"
      - ".github/workflows/replace-all-batch-ui.yml"
  push:
    branches: [develop]
    paths:
      - "editor/script/find_in_files.cpp"
      - "editor/script/find_in_files.h"
      - "misc/scripts/tests/test_replace_all_batch_ui.py"
      - ".github/workflows/replace-all-batch-ui.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile misc/scripts/tests/test_replace_all_batch_ui.py
          python3 -m unittest discover -s misc/scripts/tests -p test_replace_all_batch_ui.py -v

  editor-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
