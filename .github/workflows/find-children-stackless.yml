name: Stackless Node find_children regression tests

on:
  push:
    branches: [develop]
    paths:
      - "scene/main/node.cpp"
      - "tests/scene/test_node.cpp"
      - "misc/scripts/tests/test_find_children_stackless.py"
      - ".github/workflows/find-children-stackless.yml"
  pull_request:
    paths:
      - "scene/main/node.cpp"
      - "tests/scene/test_node.cpp"
      - "misc/scripts/tests/test_find_children_stackless.py"
      - ".github/workflows/find-children-stackless.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s misc/scripts/tests -p test_find_children_stackless.py -v

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no -j2
      - run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[SceneTree][Node] find_children stackless*"
