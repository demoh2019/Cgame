name: Test upstream Godot metadata mirror
on:
  pull_request:
    paths:
      - 'tools/upstream_mirror.py'
      - 'tools/test_upstream_mirror.py'
      - '.github/workflows/upstream-metadata-mirror*.yml'
  push:
    paths:
      - 'tools/upstream_mirror.py'
      - 'tools/test_upstream_mirror.py'
      - '.github/workflows/upstream-metadata-mirror*.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tools -p 'test_upstream_mirror.py' -v
