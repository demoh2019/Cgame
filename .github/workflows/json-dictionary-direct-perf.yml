name: JSON dictionary direct-entry serialization regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - 'core/io/json.cpp'
      - 'tests/core/io/test_json.cpp'
      - '.github/workflows/json-dictionary-direct-perf.yml'
  push:
    branches: [develop]
    paths:
      - 'core/io/json.cpp'
      - 'tests/core/io/test_json.cpp'
      - '.github/workflows/json-dictionary-direct-perf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: json-direct-dictionary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-json:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build Cgame editor and core native tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Run JSON native regression suite
        run: timeout 600s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[JSON]*" --no-colors
