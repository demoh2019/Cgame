name: FEM tetrahedral volumetric plasticity and compiler contracts

on:
  push:
    branches: [develop]
    paths:
      - "servers/physics_fem_tetra_volume_plasticity.h"
      - "servers/physics_fem_convex_star.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_fem_tetra_volume_plasticity.cpp"
      - "tests/stress/test_physics_fem_tetra_volume_plasticity_compiler.cpp"
      - "tests/stress/test_physics_fem_tetra_volume_plasticity.py"
      - ".github/workflows/physics-fem-tetra-volume-plasticity.yml"
  pull_request:
    paths:
      - "servers/physics_fem_tetra_volume_plasticity.h"
      - "servers/physics_fem_convex_star.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_fem_tetra_volume_plasticity.cpp"
      - "tests/stress/test_physics_fem_tetra_volume_plasticity_compiler.cpp"
      - "tests/stress/test_physics_fem_tetra_volume_plasticity.py"
      - ".github/workflows/physics-fem-tetra-volume-plasticity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plasticity-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Randomized plastic rest, timestep subdivision and integration contracts
        run: python3 -m unittest discover -s tests/stress -p 'test_physics_fem_tetra_volume_plasticity.py' -v
      - name: Compile and run actual FEM plasticity header in float32 and float64
        run: |
          for precision in float double; do
            flags=""
            if [ "$precision" = "double" ]; then flags="-DCGAME_USE_DOUBLE"; fi
            g++ -std=c++17 -O2 -Wall -Wextra -Werror $flags \
              -Itests/stress/physics_cpp_stubs -I. \
              tests/stress/test_physics_fem_tetra_volume_plasticity_compiler.cpp \
              -o "/tmp/fem_tetra_volume_plasticity_$precision"
            "/tmp/fem_tetra_volume_plasticity_$precision"
          done
