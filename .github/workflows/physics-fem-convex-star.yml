name: Convex multi-tetra FEM cooking and regression

on:
  push:
    branches: [develop]
    paths:
      - "servers/physics_fem_convex_star.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "tests/servers/test_physics_fem_convex_star.cpp"
      - "tests/stress/test_physics_fem_convex_star.py"
      - "tests/stress/test_physics_fem_convex_star_compiler.cpp"
      - "tests/stress/physics_fem_convex_cpp_stubs/**"
      - ".github/workflows/physics-fem-convex-star.yml"
  pull_request:
    paths:
      - "servers/physics_fem_convex_star.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "tests/servers/test_physics_fem_convex_star.cpp"
      - "tests/stress/test_physics_fem_convex_star.py"
      - "tests/stress/test_physics_fem_convex_star_compiler.cpp"
      - "tests/stress/physics_fem_convex_cpp_stubs/**"
      - ".github/workflows/physics-fem-convex-star.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convex-tetra-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual tetra FEM topology/solver in float32 and float64
        run: |
          for precision in float double; do
            flags=""
            if [ "$precision" = "double" ]; then flags="-DCGAME_USE_DOUBLE"; fi
            g++ -std=c++17 -O2 -Wall -Wextra -Werror $flags \
              -Itests/stress/physics_fem_convex_cpp_stubs -I. \
              tests/stress/test_physics_fem_convex_star_compiler.cpp \
              -o "/tmp/fem_convex_star_$precision"
            "/tmp/fem_convex_star_$precision"
          done
      - name: Verify 4000 randomized convex geometry and source contracts
        run: python3 -m unittest discover -s tests/stress -p 'test_physics_fem_convex_star.py' -v
