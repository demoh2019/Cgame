name: Mesh triangle generation no-metadata bulk-copy regression

on:
  pull_request:
    branches: [develop]
    paths:
      - "scene/resources/mesh.cpp"
      - "tests/scene/test_arraymesh.cpp"
      - ".github/workflows/mesh-triangle-bulk-copy.yml"
  push:
    branches: [develop]
    paths:
      - "scene/resources/mesh.cpp"
      - "tests/scene/test_arraymesh.cpp"
      - ".github/workflows/mesh-triangle-bulk-copy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-triangle-bulk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Verify unindexed and indexed triangle and strip geometry
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[Mesh][Performance] Triangle mesh generation*" --no-colors
