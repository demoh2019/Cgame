name: Jolt soft-soft CPU particle contact contracts

on:
  pull_request:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/objects/jolt_soft_body_3d.cpp"
      - "modules/jolt_physics/objects/jolt_soft_body_3d.h"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_soft_soft_particle_contacts.py"
      - "tests/stress/jolt_soft_soft/**"
      - ".github/workflows/jolt-soft-soft-particle-contacts.yml"
  push:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/objects/jolt_soft_body_3d.cpp"
      - "modules/jolt_physics/objects/jolt_soft_body_3d.h"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_soft_soft_particle_contacts.py"
      - "tests/stress/jolt_soft_soft/**"
      - ".github/workflows/jolt-soft-soft-particle-contacts.yml"
  workflow_dispatch:

jobs:
  particle-contact-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test impulses, friction, bounded work and layer checks
        run: python3 -m unittest tests/stress/test_jolt_soft_soft_particle_contacts.py -v
      - name: Validate fixture and Python syntax
        run: |
          python3 -m py_compile tests/stress/test_jolt_soft_soft_particle_contacts.py
          test -f tests/stress/jolt_soft_soft/project.godot
          test -f tests/stress/jolt_soft_soft/soft_soft_particle_regression.gd
