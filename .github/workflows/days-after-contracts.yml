name: Days After survivor contracts integration

on:
  pull_request:
    paths:
      - 'demo/days_after/**'
      - '.github/workflows/days-after-contracts.yml'
  push:
    branches: [develop]
    paths:
      - 'demo/days_after/**'
      - '.github/workflows/days-after-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Godot 4.7.2 compatibility editor
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 -fL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Validate GDScript import
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./godot --headless --path demo/days_after --editor --import --quit 2>&1 | tee import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource' import.log; then exit 1; fi
      - name: Execute gameplay, save compatibility, and contract regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in smoke_test.gd smoke_test_saves.gd smoke_test_contracts.gd; do
            timeout 120s ./godot --headless --path demo/days_after --script "res://$test" 2>&1 | tee "$test.log"
            grep -F 'PASS:' "$test.log"
            if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource|Assertion failed' "$test.log"; then
              exit 1
            fi
          done
          grep -F 'PASS: survivor contracts, scavenging' smoke_test_contracts.gd.log
      - name: Attach regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: days-after-contract-regression
          if-no-files-found: ignore
          path: |
            import.log
            smoke_test.gd.log
            smoke_test_saves.gd.log
            smoke_test_contracts.gd.log
