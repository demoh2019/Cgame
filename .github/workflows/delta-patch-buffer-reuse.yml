name: Chained delta patch buffer reuse regressions

on:
  push:
    branches: [develop]
    paths:
      - 'core/io/file_access_patched.cpp'
      - 'tests/core/io/test_delta_encoding.cpp'
      - '.github/workflows/delta-patch-buffer-reuse.yml'
  pull_request:
    paths:
      - 'core/io/file_access_patched.cpp'
      - 'tests/core/io/test_delta_encoding.cpp'
      - '.github/workflows/delta-patch-buffer-reuse.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-delta-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build native editor and doctests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Verify chained delta encoding and ping-pong allocation reuse
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[DeltaEncoding]*" --no-colors
