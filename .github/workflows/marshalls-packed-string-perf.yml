name: Packed string Variant serialization performance and bounds regressions

on:
  push:
    branches: [develop]
    paths:
      - 'core/io/marshalls.cpp'
      - 'tests/core/io/test_marshalls.cpp'
      - '.github/workflows/marshalls-packed-string-perf.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'core/io/marshalls.cpp'
      - 'tests/core/io/test_marshalls.cpp'
      - '.github/workflows/marshalls-packed-string-perf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marshalls-packed-string-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-marshalls-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build engine tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Run full marshalls regression suite
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[Marshalls]*" --no-colors
