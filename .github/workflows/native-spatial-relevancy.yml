name: Cgame native spatial relevancy and Albion After snapshot regression

on:
  pull_request:
    paths:
      - 'scene/main/spatial_relevancy_grid_2d.*'
      - 'scene/register_scene_types.cpp'
      - 'tests/scene/test_spatial_relevancy_grid_2d.cpp'
      - 'game/scripts/server/game_server.gd'
      - 'game/scripts/shared/net.gd'
      - 'game/tests/test_snapshot_interest_grid.gd'
      - 'game/tests/run_all.gd'
      - '.github/workflows/native-spatial-relevancy.yml'
  push:
    branches: [develop]
    paths:
      - 'scene/main/spatial_relevancy_grid_2d.*'
      - 'scene/register_scene_types.cpp'
      - 'tests/scene/test_spatial_relevancy_grid_2d.cpp'
      - 'game/scripts/server/game_server.gd'
      - 'game/scripts/shared/net.gd'
      - '.github/workflows/native-spatial-relevancy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-network-relevancy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin
      - uses: ./.github/actions/godot-deps
      - name: Build Cgame with native unit tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_text_server_fb_enabled=yes -j2
      - name: Run native relevancy regression
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          timeout 180s "$BIN" --headless --test --test-case="[SpatialRelevancyGrid2D]*" --no-colors 2>&1 | tee native-relevancy-tests.log
      - name: Import and test Albion After
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee native-relevancy-import.log
          timeout 360s "$BIN" --headless --path game --script res://tests/run_all.gd 2>&1 | tee native-relevancy-game-tests.log
          grep -E '^TOTAL [0-9]+ checks, 0 failures$' native-relevancy-game-tests.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' native-relevancy-import.log native-relevancy-game-tests.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-relevancy-diagnostics
          if-no-files-found: ignore
          path: |
            native-relevancy-tests.log
            native-relevancy-import.log
            native-relevancy-game-tests.log
