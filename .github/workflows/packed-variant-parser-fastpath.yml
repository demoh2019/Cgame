name: Packed Variant Parser Fast Path
on:
  pull_request:
    paths:
      - "core/variant/variant_parser.cpp"
      - "tests/core/variant/test_variant.cpp"
      - ".github/workflows/packed-variant-parser-fastpath.yml"
  workflow_dispatch:

jobs:
  packed-array-parser:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: linux-packed-variant-parser-tests
        continue-on-error: true
      - uses: ./.github/actions/godot-deps
      - name: Compile editor with native tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - uses: ./.github/actions/godot-cache-save
        with:
          cache-name: linux-packed-variant-parser-tests
        continue-on-error: true
      - name: Run packed parser regression tests
        run: ./bin/godot.linuxbsd.editor.x86_64 --headless --test --test-case="*[PackedParseFastPath]*"
