name: Physics softbody volume numerical contracts

on:
  pull_request:
    paths:
      - "servers/physics_softbody_volume_safe.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/servers/test_physics_softbody_volume_safe.cpp"
      - "tests/stress/test_physics_softbody_volume_safe.py"
      - ".github/workflows/physics-softbody-volume-safe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  softbody-volume-contracts:
    name: Closed SoftBody volume scale and gradient contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify scale invariance, finite gradients and solver wiring
        run: python3 -m unittest discover -s tests/stress -p 'test_physics_softbody_volume_safe.py' -v
