name: Upstream OBJ / ImporterMesh regressions

on:
  push:
    branches: [develop]
    paths:
      - 'editor/import/3d/resource_importer_obj.cpp'
      - 'scene/resources/3d/importer_mesh.cpp'
      - 'scene/resources/mesh.h'
      - 'tests/scene/test_arraymesh.cpp'
      - 'misc/scripts/tests/test_upstream_obj_mesh_20261119.py'
      - '.github/workflows/upstream-obj-mesh-regressions.yml'
  pull_request:
    paths:
      - 'editor/import/3d/resource_importer_obj.cpp'
      - 'scene/resources/3d/importer_mesh.cpp'
      - 'scene/resources/mesh.h'
      - 'tests/scene/test_arraymesh.cpp'
      - 'misc/scripts/tests/test_upstream_obj_mesh_20261119.py'
      - '.github/workflows/upstream-obj-mesh-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run OBJ and ImporterMesh source invariants
        run: python -m unittest discover -s misc/scripts/tests -p test_upstream_obj_mesh_20261119.py -v
