name: PCG Graph integration tests
on:
  pull_request:
    paths:
      - 'misc/pcg_graph/**'
      - '.github/workflows/pcg_graph_tests.yml'
  push:
    paths:
      - 'misc/pcg_graph/**'
      - '.github/workflows/pcg_graph_tests.yml'

permissions:
  contents: read

jobs:
  gdscript-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official Godot 4.7.2 binary
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 -fL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Import project and check editor plugin parsing
        run: ./godot --headless --path misc/pcg_graph --editor --import --quit
      - name: Run PCG Graph integration suite
        run: ./godot --headless --path misc/pcg_graph --script res://tests/test_pcg_graph.gd
