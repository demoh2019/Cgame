name: Node children linear cache native regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - 'scene/main/node.cpp'
      - 'tests/scene/test_node.cpp'
      - '.github/workflows/node-children-linear-cache-perf.yml'
  push:
    branches: [develop]
    paths:
      - 'scene/main/node.cpp'
      - 'tests/scene/test_node.cpp'
      - '.github/workflows/node-children-linear-cache-perf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-children-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-node-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build native Cgame editor with tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Verify Node child-cache regression tests
        run: timeout 600s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[SceneTree][Node]*" --no-colors
