name: Resource UID cache preallocation regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - 'core/io/resource_uid.cpp'
      - 'tests/core/io/test_resource_uid.cpp'
      - '.github/workflows/perf-resource-uid-cache.yml'
  push:
    branches: [develop]
    paths:
      - 'core/io/resource_uid.cpp'
      - 'tests/core/io/test_resource_uid.cpp'
      - '.github/workflows/perf-resource-uid-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-resource-uid:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build Cgame native editor and tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Run UID cache serialization and parse regressions
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          "$BIN" --headless --test --test-case="*[ResourceUID]*" --no-colors
