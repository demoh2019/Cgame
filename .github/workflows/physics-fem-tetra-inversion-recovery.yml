name: FEM tetra inversion recovery numerical and compiler contracts

on:
  push:
    branches: [develop]
    paths:
      - "servers/physics_fem_tetra_inversion_recovery.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_fem_tetra_inversion_recovery.cpp"
      - "tests/stress/test_physics_fem_tetra_inversion_recovery_compiler.cpp"
      - "tests/stress/test_physics_fem_tetra_inversion_recovery.py"
      - ".github/workflows/physics-fem-tetra-inversion-recovery.yml"
  pull_request:
    paths:
      - "servers/physics_fem_tetra_inversion_recovery.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_fem_tetra_inversion_recovery.cpp"
      - "tests/stress/test_physics_fem_tetra_inversion_recovery_compiler.cpp"
      - "tests/stress/test_physics_fem_tetra_inversion_recovery.py"
      - ".github/workflows/physics-fem-tetra-inversion-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inversion-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Orientation, pins and source contracts
        run: python3 -m unittest discover -s tests/stress -p 'test_physics_fem_tetra_inversion_recovery.py' -v
      - name: Compile and run real FEM inversion recovery in float32 and float64
        run: |
          for precision in float double; do
            flags=""
            if [ "$precision" = "double" ]; then flags="-DCGAME_USE_DOUBLE"; fi
            g++ -std=c++17 -O2 -Wall -Wextra -Werror $flags \
              -Itests/stress/physics_cpp_stubs -I. \
              tests/stress/test_physics_fem_tetra_inversion_recovery_compiler.cpp \
              -o "/tmp/fem_inversion_recovery_$precision"
            "/tmp/fem_inversion_recovery_$precision"
          done
