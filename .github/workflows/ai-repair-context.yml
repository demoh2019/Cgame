name: AI repair context tests

on:
  push:
    branches: [develop]
    paths:
      - 'misc/scripts/ai_repair_context.py'
      - 'misc/scripts/tests/test_ai_repair_context.py'
      - 'misc/scripts/README_ai_repair_context.md'
      - '.github/workflows/ai-repair-context.yml'
  pull_request:
    paths:
      - 'misc/scripts/ai_repair_context.py'
      - 'misc/scripts/tests/test_ai_repair_context.py'
      - 'misc/scripts/README_ai_repair_context.md'
      - '.github/workflows/ai-repair-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-repair-context:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check script and test syntax
        run: python -m py_compile misc/scripts/ai_repair_context.py misc/scripts/tests/test_ai_repair_context.py
      - name: Run offline AI repair-context regressions
        run: python -m unittest discover -s misc/scripts/tests -p test_ai_repair_context.py -v
