name: Geometry2D winner-only atlas allocation regression

on:
  pull_request:
    branches: [develop]
    paths:
      - "core/math/geometry_2d.cpp"
      - "tests/core/math/test_geometry_2d.cpp"
      - ".github/workflows/geometry2d-atlas-winner-only.yml"
  push:
    branches: [develop]
    paths:
      - "core/math/geometry_2d.cpp"
      - "tests/core/math/test_geometry_2d.cpp"
      - ".github/workflows/geometry2d-atlas-winner-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-atlas-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Verify atlas placements, aspect-score selection and large inputs
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*Atlas*" --no-colors
