name: Object Script Getter Fast Path Tests
on:
  pull_request:
    paths:
      - "core/object/object.cpp"
      - "core/io/json.cpp"
      - "core/io/marshalls.cpp"
      - "tests/core/object/test_placeholder_script_instance.cpp"
      - ".github/workflows/object-get-script-fastpath.yml"
  workflow_dispatch:

jobs:
  object-script-getter:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Compile editor with native tests
        run: scons platform=linuxbsd target=editor tests=yes module_text_server_fb_enabled=yes -j2
      - name: Run object script fast-path regression tests
        run: ./bin/godot.linuxbsd.editor.x86_64 --headless --test --test-case="*[ObjectGetScript]*"
      - name: Run script serialization fast-path regression tests
        run: ./bin/godot.linuxbsd.editor.x86_64 --headless --test --test-case="*[ScriptSerializationFastPath]*"
