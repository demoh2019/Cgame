name: SoftBody3D viscoelastic area-rate damping contracts

on:
  pull_request:
    paths:
      - "servers/physics_softbody_area_rate_damping.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/servers/test_physics_softbody_area_rate_damping.cpp"
      - "tests/stress/test_physics_softbody_area_rate_damping.py"
      - ".github/workflows/physics-softbody-area-rate-damping.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_softbody_area_rate_damping.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/stress/test_physics_softbody_area_rate_damping.py"
      - ".github/workflows/physics-softbody-area-rate-damping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check area-rate conservation laws and GodotPhysics3D integration
        run: python3 -m unittest discover -s tests/stress -p test_physics_softbody_area_rate_damping.py -v
