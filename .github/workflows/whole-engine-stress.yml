name: Whole-engine extreme stress and resource regression

on:
  push:
    branches: [develop]
    paths:
      - 'tests/stress/**'
      - '.github/workflows/whole-engine-stress.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'tests/stress/**'
      - '.github/workflows/whole-engine-stress.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      preset:
        description: Stress intensity (brutal is manual only)
        required: true
        type: choice
        options: [smoke, standard, soak, brutal]
        default: smoke
      render_mode:
        description: Headless CPU/physics, or virtual display software OpenGL
        required: true
        type: choice
        options: [headless, display]
        default: headless
      scaling_sweep:
        description: Run all headless/display workloads at three load scales (slow)
        required: false
        type: boolean
        default: false
      cases:
        description: Comma-separated cases, or all
        required: false
        type: string
        default: all
      ramp:
        description: Increase per-case scale until failure or a watchdog limit
        required: false
        type: boolean
        default: false
      ramp_steps:
        description: Maximum geometric load levels per case
        required: false
        type: number
        default: 4

permissions:
  contents: read

concurrency:
  group: whole-engine-stress-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  harness-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check runner and tests
        run: python3 -m py_compile tests/stress/run.py tests/stress/test_run.py tests/stress/diagnose.py tests/stress/test_diagnose.py tests/stress/scale_sweep.py tests/stress/test_scale_sweep.py tests/stress/test_registry.py
      - name: Run harness unit tests
        run: python3 -m unittest discover -s tests/stress -p 'test_*.py' -v

  native-stress:
    # Build and benchmark the actual fork, not an unrelated downloaded Godot release.
    # Never run the enormous brutal preset automatically.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: harness-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PRESET: ${{ github.event_name == 'workflow_dispatch' && inputs.preset || 'smoke' }}
      RENDER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.render_mode || 'headless' }}
      STRESS_CASES: ${{ github.event_name == 'workflow_dispatch' && inputs.cases || 'all' }}
      STRESS_RAMP: ${{ github.event_name == 'workflow_dispatch' && inputs.ramp || 'false' }}
      STRESS_RAMP_STEPS: ${{ github.event_name == 'workflow_dispatch' && inputs.ramp_steps || '4' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Xvfb and software GL for optional display tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - uses: ./.github/actions/godot-deps
      - name: Build native Cgame with tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_text_server_fb_enabled=yes -j2
      - name: Verify GDScript workload parses
        shell: bash
        run: |
          set -euo pipefail
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://stress.gd --check-only
      - name: Run the complete native C++ test suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 1800s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --no-colors 2>&1 | tee whole-engine-native-tests.log
      - name: Run actual engine workloads under memory and timeout watchdogs
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          "$BIN" --version
          ARGS=(--godot "$BIN" --preset "$PRESET" --render-mode "$RENDER_MODE" --case "$STRESS_CASES" --output whole-engine-stress.json --summary-md whole-engine-stress.md)
          if [[ "$STRESS_RAMP" == "true" ]]; then
            ARGS+=(--ramp --ramp-steps "$STRESS_RAMP_STEPS")
          fi
          if [[ "$RENDER_MODE" == "display" ]]; then
            # Software GL only: results must NOT be compared with discrete-GPU measurements.
            xvfb-run -a python3 tests/stress/run.py "${ARGS[@]}"
          else
            python3 tests/stress/run.py "${ARGS[@]}"
          fi
      - name: Benchmark cold and warm asset import, script scanning and scene indexing
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/stress/editor_import.py \
            --godot ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --textures 128 --scenes 512 --repeats 3 \
            --timeout 900 --rss-limit-mib 4096 \
            --output whole-engine-import.json
      - name: Analyze resource and timing hotspots
        if: always()
        shell: bash
        run: |
          if [[ -f whole-engine-stress.json ]]; then
            python3 tests/stress/diagnose.py whole-engine-stress.json --output whole-engine-bottlenecks.md
          fi
      - name: Find nonlinear engine bottlenecks at three load levels
        if: github.event_name == 'workflow_dispatch' && inputs.scaling_sweep
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          if [[ "$RENDER_MODE" == "display" ]]; then
            xvfb-run -a python3 tests/stress/scale_sweep.py --godot "$BIN" --render-mode display --case all --scales 1,2,4 --frames 30 --repeats 2 --output whole-engine-scale-sweep.json --summary-md whole-engine-scale-sweep.md
          else
            python3 tests/stress/scale_sweep.py --godot "$BIN" --render-mode headless --case all --scales 1,2,4 --frames 30 --repeats 2 --output whole-engine-scale-sweep.json --summary-md whole-engine-scale-sweep.md
          fi
      - name: Archive per-scenario performance and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgame-stress-${{ env.PRESET }}-${{ env.RENDER_MODE }}
          path: |
            whole-engine-stress.json
            whole-engine-stress.md
            whole-engine-bottlenecks.md
            whole-engine-native-tests.log
            whole-engine-import.json
            whole-engine-scale-sweep.json
            whole-engine-scale-sweep.md
          if-no-files-found: warn
          retention-days: 30
