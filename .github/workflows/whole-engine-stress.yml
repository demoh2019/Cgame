  native-stress:
    # Build and benchmark the actual fork, not an unrelated downloaded Godot release.
    # Never run the enormous brutal preset automatically.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'pull_request'
    needs: harness-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PRESET: ${{ github.event_name == 'workflow_dispatch' && inputs.preset || 'smoke' }}
      RENDER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.render_mode || 'headless' }}
      RUN_CASES: ${{ github.event_name == 'workflow_dispatch' && inputs.cases || 'all' }}
      RUN_RAMP: ${{ github.event_name == 'workflow_dispatch' && inputs.ramp || false }}
      RUN_RAMP_STEPS: ${{ github.event_name == 'workflow_dispatch' && inputs.ramp_steps || 4 }}
      RUN_RAMP_FACTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.ramp_factor || 2 }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Xvfb and software GL for optional display tests
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri
      - uses: ./.github/actions/godot-deps
      - name: Build native Cgame with tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_text_server_fb_enabled=yes -j2
      - name: Verify GDScript workload parses
        shell: bash
        run: |
          set -euo pipefail
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress \
            --script res://physics_softbody_gas_leak_3d_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://stress.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://memory_soak.gd --check-only
      - name: Run the complete native C++ test suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 1800s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --no-colors 2>&1 | tee whole-engine-native-tests.log
      - name: Run actual engine workloads under memory and timeout watchdogs
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          "$BIN" --version
          RUN_ARGS=(--case "$RUN_CASES")
          if [[ "$RUN_RAMP" == "true" ]]; then
            RUN_ARGS+=(--ramp --ramp-steps "$RUN_RAMP_STEPS" --ramp-factor "$RUN_RAMP_FACTOR")
          fi
          if [[ "$RENDER_MODE" == "display" ]]; then
            # Software GL only: results must NOT be compared with discrete-GPU measurements.
            xvfb-run -a python3 tests/stress/run.py --godot "$BIN" --preset "$PRESET" --render-mode display "${RUN_ARGS[@]}" --output whole-engine-stress.json --summary-md whole-engine-stress.md
          else
            python3 tests/stress/run.py --godot "$BIN" --preset "$PRESET" --render-mode headless "${RUN_ARGS[@]}" --output whole-engine-stress.json --summary-md whole-engine-stress.md
          fi
      - name: Benchmark cold and warm asset import, script scanning and scene indexing
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/stress/editor_import.py \
            --godot ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --textures 128 --scenes 512 --repeats 3 \
            --timeout 900 --rss-limit-mib 4096 \
            --output whole-engine-import.json
      - name: Analyze resource and timing hotspots
        if: always()
        shell: bash
        run: |
          if [[ -f whole-engine-stress.json ]]; then
            python3 tests/stress/diagnose.py whole-engine-stress.json --output whole-engine-bottlenecks.md
          fi
      - name: Find nonlinear engine bottlenecks at three load levels
        if: github.event_name == 'workflow_dispatch' && inputs.scaling_sweep
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          if [[ "$RENDER_MODE" == "display" ]]; then
            xvfb-run -a python3 tests/stress/scale_sweep.py --godot "$BIN" --render-mode display --case all --scales 1,2,4 --frames 30 --repeats 2 --output whole-engine-scale-sweep.json --summary-md whole-engine-scale-sweep.md
          else
            python3 tests/stress/scale_sweep.py --godot "$BIN" --render-mode headless --case all --scales 1,2,4 --frames 30 --repeats 2 --output whole-engine-scale-sweep.json --summary-md whole-engine-scale-sweep.md
          fi
      - name: Run in-process memory retention smoke
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/stress/memory_soak.py \
            --godot ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --cycles 50 --batch 60 --repeats 1 \
            --timeout 180 --rss-limit-mib 2048 \
            --output whole-engine-memory-soak.json
      - name: Archive per-scenario performance and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cgame-stress-${{ env.PRESET }}-${{ env.RENDER_MODE }}
          path: |
            whole-engine-stress.json
            whole-engine-stress.md
            whole-engine-bottlenecks.md
            whole-engine-native-tests.log
            whole-engine-import.json
            whole-engine-memory-soak.json
            whole-engine-scale-sweep.json
            whole-engine-scale-sweep.md
          if-no-files-found: warn
          retention-days: 30
