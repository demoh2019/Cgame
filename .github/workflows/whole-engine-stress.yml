name: Whole-engine extreme stress and resource regression

on:
  push:
    branches: [develop]
    paths:
      - 'tests/stress/**'
      - 'modules/godot_physics_2d/godot_step_2d.cpp'
      - 'modules/godot_physics_3d/godot_step_3d.cpp'
      - 'modules/godot_physics_3d/godot_step_3d.h'
      - 'modules/jolt_physics/spaces/jolt_space_3d.cpp'
      - 'modules/jolt_physics/objects/jolt_soft_body_3d.cpp'
      - 'modules/jolt_physics/jolt_physics_server_3d.cpp'
      - 'modules/jolt_physics/jolt_physics_server_3d.h'
      - 'modules/jolt_physics/spaces/jolt_layers.cpp'
      - 'modules/jolt_physics/spaces/jolt_layers.h'
      - 'modules/jolt_physics/spaces/jolt_contact_listener_3d.cpp'
      - 'modules/jolt_physics/spaces/jolt_contact_listener_3d.h'
      - 'modules/jolt_physics/spaces/jolt_job_system.cpp'
      - 'modules/jolt_physics/spaces/jolt_job_system.h'
      - 'modules/jolt_physics/spaces/jolt_space_3d.h'
      - 'modules/jolt_physics/jolt_project_settings.cpp'
      - 'modules/jolt_physics/jolt_project_settings.h'
      - '.github/workflows/whole-engine-stress.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'tests/stress/**'
      - 'modules/godot_physics_2d/godot_step_2d.cpp'
      - 'modules/godot_physics_3d/godot_step_3d.cpp'
      - 'modules/godot_physics_3d/godot_step_3d.h'
      - 'modules/jolt_physics/spaces/jolt_space_3d.cpp'
      - 'modules/jolt_physics/objects/jolt_soft_body_3d.cpp'
      - 'modules/jolt_physics/jolt_physics_server_3d.cpp'
      - 'modules/jolt_physics/jolt_physics_server_3d.h'
      - 'modules/jolt_physics/spaces/jolt_layers.cpp'
      - 'modules/jolt_physics/spaces/jolt_layers.h'
      - 'modules/jolt_physics/spaces/jolt_contact_listener_3d.cpp'
      - 'modules/jolt_physics/spaces/jolt_contact_listener_3d.h'
      - 'modules/jolt_physics/spaces/jolt_job_system.cpp'
      - 'modules/jolt_physics/spaces/jolt_job_system.h'
      - 'modules/jolt_physics/spaces/jolt_space_3d.h'
      - 'modules/jolt_physics/jolt_project_settings.cpp'
      - 'modules/jolt_physics/jolt_project_settings.h'
      - '.github/workflows/whole-engine-stress.yml'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      preset:
        description: Stress intensity (brutal is manual only)
        required: true
        type: choice
        options: [smoke, standard, soak, brutal]
        default: smoke
      render_mode:
        description: Headless CPU/physics, or virtual display software OpenGL
        required: true
        type: choice
        options: [headless, display]
        default: headless
      scaling_sweep:
        description: Run all headless/display workloads at three load scales (slow)
        required: false
        type: boolean
        default: false
      cases:
        description: Comma-separated stress cases or all
        required: false
        type: string
        default: all
      ramp:
        description: Bounded ramp to failure (manual only)
        required: false
        type: boolean
        default: false
      ramp_steps:
        description: Maximum scale levels
        required: false
        type: number
        default: 4
      ramp_factor:
        description: Geometric scale factor
        required: false
        type: number
        default: 2

permissions:
  contents: read

concurrency:
  group: whole-engine-stress-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  harness-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check runner and tests
        run: python3 -m py_compile tests/stress/run.py tests/stress/test_run.py tests/stress/diagnose.py tests/stress/test_diagnose.py tests/stress/scale_sweep.py tests/stress/test_scale_sweep.py tests/stress/test_registry.py tests/stress/process_tree.py tests/stress/test_process_tree.py
      - name: Run harness unit tests
        run: python3 -m unittest discover -s tests/stress -p 'test_*.py' -v

  physics-native-smoke:
    # PRs and pushes must compile and exercise the changed native physics code.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: harness-tests
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot-deps
      - name: Build native physics backend
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_text_server_fb_enabled=yes -j2
      - name: Verify sealed gas leak native EOS and mass-loss regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --test --test-case="*[PhysicsGasLeak]*" \
            --success=true --no-colors 2>&1 | tee physics-softbody-gas-leak-native.log
          grep -Fq '[PhysicsGasLeak]' physics-softbody-gas-leak-native.log
      - name: Runtime vented versus sealed SoftBody balloon regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --path tests/stress \
            --script res://physics_softbody_gas_leak_3d_regression.gd \
            2>&1 | tee physics-softbody-gas-leak-runtime.log
          grep -Fq 'SoftBody sealed gas discharge passed' physics-softbody-gas-leak-runtime.log
      - name: Native tilted capsule hydrostatic integration regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --test --test-case="*[PhysicsTiltedCapsule]*" \
            --success=true --no-colors 2>&1 | tee physics-fluid-tilted-capsule-native.log
          grep -Fq '[PhysicsTiltedCapsule]' physics-fluid-tilted-capsule-native.log
      - name: Runtime tilted capsule restoring torque and symmetry
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --path tests/stress \
            --script res://physics_tilted_capsule_buoyancy_3d_regression.gd \
            2>&1 | tee physics-fluid-tilted-capsule-runtime.log
          grep -Fq 'Tilted capsule restoring torque passed' physics-fluid-tilted-capsule-runtime.log
      - name: Native tilted cylinder exact displaced-volume regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --test --test-case="*[PhysicsCylinderFluid]*" \
            --success=true --no-colors 2>&1 | tee physics-fluid-cylinder-native.log
          grep -Fq '[PhysicsCylinderFluid]' physics-fluid-cylinder-native.log
      - name: Runtime exact cylinder immersion and restoring torque
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --path tests/stress \
            --script res://physics_cylinder_buoyancy_3d_regression.gd \
            2>&1 | tee physics-fluid-cylinder-runtime.log
          grep -Fq 'Exact cylinder buoyancy passed' physics-fluid-cylinder-runtime.log
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress \
            --script res://physics_cylinder_buoyancy_3d_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress \
            --script res://physics_cylinder_fluid_stress.gd --check-only
      - name: Native exact affine ellipsoid hydrostatics regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --test --test-case="*[PhysicsEllipsoid]*" \
            --success=true --no-colors 2>&1 | tee physics-fluid-ellipsoid-native.log
          grep -Fq '[PhysicsEllipsoid]' physics-fluid-ellipsoid-native.log
      - name: Runtime ellipsoid buoyancy versus matched sphere control
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --path tests/stress \
            --script res://physics_ellipsoid_buoyancy_3d_regression.gd \
            2>&1 | tee physics-fluid-ellipsoid-runtime.log
          grep -Fq 'Affine ellipsoid buoyancy passed' physics-fluid-ellipsoid-runtime.log
      - name: Syntax-check physics stress scripts
        shell: bash
        run: |
          set -euo pipefail
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_tilted_capsule_buoyancy_3d_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress \
            --script res://physics_cylinder_buoyancy_3d_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress \
            --script res://physics_cylinder_fluid_stress.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress \
            --script res://physics_ellipsoid_buoyancy_3d_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://stress.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_dense.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_pending_reuse_stress.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_pending_index_churn.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_pending_broadphase_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_contact_scratch_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_softbody_area_overlap_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_softbody_vertex_dedup_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_softbody_constraint_bounds_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_softbody_wind_fastpath_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_softbody_lra_shrink_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_softbody_volume_shrink_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_softbody_anisotropic_fiber_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_layer_filter_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_broadphase_filter_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_area_event_dedup_regression.gd --check-only
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_jolt_process_info_regression.gd --check-only
      - name: Verify dense contacts, pending cleanup and fast CCD
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/stress/run.py \
            --godot ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --preset smoke --render-mode headless \
            --case physics_dense_2d,physics_dense_3d,physics_pending_3d,physics_ccd_3d \
            --output physics-native-smoke.json --summary-md physics-native-smoke.md
      - name: Regression-test native 2D CCD support edges and relative motion
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          # Explicitly select the backend under test even when other
          # physics implementations are available in this build.
          PROJECT="$RUNNER_TEMP/cgame-godotphysics2d-ccd"
          mkdir -p "$PROJECT"
          cp -a tests/stress/. "$PROJECT/"
          printf '\n[physics]\n2d/physics_engine="GodotPhysics2D"\n' >> "$PROJECT/project.godot"
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://physics_ccd_edge_2d_regression.gd \
            2>&1 | tee physics2d-ccd-edge.log
          grep -Fq '2D CCD edge regression: passed' physics2d-ccd-edge.log
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://physics_ccd_relative_motion_2d_regression.gd \
            2>&1 | tee physics2d-ccd-relative.log
          grep -Fq '2D relative-motion CCD regression passed.' physics2d-ccd-relative.log
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://physics_ccd_circle_segment_2d_regression.gd \
            2>&1 | tee physics2d-circle-segment-ccd.log
          grep -Fq '2D circle-segment CCD regression passed.' physics2d-circle-segment-ccd.log
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://physics_ccd_capsule_segment_2d_regression.gd \
            2>&1 | tee physics2d-capsule-segment-ccd.log
          grep -Fq '2D capsule-segment CCD regression passed.' physics2d-capsule-segment-ccd.log
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://physics_ccd_rotating_capsule_segment_2d_regression.gd \
            2>&1 | tee physics2d-rotating-capsule-segment-ccd.log
          grep -Fq '2D rotating capsule-segment CCD regression passed.' physics2d-rotating-capsule-segment-ccd.log
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://physics_ccd_nonlinear_capsule_toi_regression.gd \
            2>&1 | tee physics-mixed-capsule-ccd.log
          grep -Fq '2D/3D mixed nonlinear capsule CCD regression passed.' physics-mixed-capsule-ccd.log

      - name: Regression-test analytic circle-segment TOI in native C++
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --test --test-case="*CircleSegmentTOI*" \
            --success=true --no-colors 2>&1 | tee physics2d-circle-segment-toi.log
          grep -Fq '[CircleSegmentTOI]' physics2d-circle-segment-toi.log

      - name: Regression-test capsule-segment volume TOI in native C++
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --test --test-case="*CapsuleSegmentTOI*" \
            --success=true --no-colors 2>&1 | tee physics2d-capsule-segment-toi.log
          grep -Fq '[CapsuleSegmentTOI]' physics2d-capsule-segment-toi.log

      - name: Regression-test rotating capsule versus finite segment nonlinear CCD
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --test --test-case="*RotatingCapsuleSegmentTOI*" \
            --success=true --no-colors 2>&1 | tee physics2d-rotating-capsule-segment-toi.log
          grep -Fq '[RotatingCapsuleSegmentTOI]' physics2d-rotating-capsule-segment-toi.log

      - name: Regression-test nonlinear combined-velocity capsule CCD
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/stress/test_physics_ccd_nonlinear_capsule_toi.py
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --test --test-case="*MixedCapsuleTOI*" \
            --success=true --no-colors 2>&1 | tee physics-mixed-capsule-toi.log
          grep -Fq '[MixedCapsuleTOI]' physics-mixed-capsule-toi.log

      - name: Exercise repeated Jolt pending-body batch reuse
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --path tests/stress --script res://physics_pending_reuse_stress.gd | tee physics-pending-reuse.log
          grep -q '^PHYSICS_PENDING_REUSE_RESULT:' physics-pending-reuse.log
      - name: Stress Jolt compact pending-body indexes
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/cgame-jolt-pending-index"
          mkdir -p "$PROJECT"
          cp -a tests/stress/. "$PROJECT/"
          printf '\n[physics]\n3d/physics_engine="Jolt Physics"\n' >> "$PROJECT/project.godot"
          timeout 180s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --path "$PROJECT" \
            --script res://physics_jolt_pending_index_churn.gd \
            2>&1 | tee physics-jolt-pending-index.log
          grep -Fq 'Jolt pending index churn regression passed.' physics-jolt-pending-index.log
      - name: Stress Jolt pending-only removal with paused simulation
        shell: bash
        run: |
          set -euo pipefail
          # Select Jolt explicitly: other 3D backends may differ here.
          PROJECT="$RUNNER_TEMP/cgame-jolt-pending-broadphase"
          mkdir -p "$PROJECT"
          cp -a tests/stress/. "$PROJECT/"
          printf '\n[physics]\n3d/physics_engine="Jolt Physics"\n' >> "$PROJECT/project.godot"
          timeout 180s ./bin/godot.linuxbsd.editor.dev.x86_64 \
            --headless --path "$PROJECT" \
            --script res://physics_jolt_pending_broadphase_regression.gd \
            2>&1 | tee physics-jolt-pending-broadphase.log
          grep -Fq 'Jolt pending broadphase regression passed.' physics-jolt-pending-broadphase.log
      - name: Regression-test conservative self vertex-face CCD
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          PROJECT=tests/stress/jolt_soft_self_vf_sweep
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://swept_self_triangle_regression.gd --check-only
          timeout 180s "$BIN" --headless --path "$PROJECT" \
            --script res://swept_self_triangle_regression.gd \
            2>&1 | tee jolt-soft-self-vf-ccd.log
          grep -Fq 'PASS: Jolt swept self vertex-face CCD versus unopposed control' jolt-soft-self-vf-ccd.log
      - name: Regression-test speculative self edge-edge CCD
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          PROJECT=tests/stress/jolt_soft_self_edge_sweep
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://swept_self_edges_regression.gd --check-only
          timeout 180s "$BIN" --headless --path "$PROJECT" \
            --script res://swept_self_edges_regression.gd \
            2>&1 | tee jolt-soft-self-edge-sweep.log
          grep -Fq 'PASS: Jolt swept self edge-edge CCD versus unopposed control' jolt-soft-self-edge-sweep.log
      - name: Regression-test Jolt compliant self-contact position projection
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          PROJECT=tests/stress/jolt_soft_self_position
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://position_projection_regression.gd --check-only
          timeout 180s "$BIN" --headless --path "$PROJECT" \
            --script res://position_projection_regression.gd \
            2>&1 | tee jolt-soft-self-position.log
          grep -Fq 'PASS: Jolt compliant Jacobi self-contact position projection' jolt-soft-self-position.log
      - name: Regression-test persistent Jolt self-face BVH refit and cache eviction
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          PROJECT=tests/stress/jolt_soft_self_face_bvh
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://persistent_face_bvh_regression.gd --check-only
          timeout 180s "$BIN" --headless --path "$PROJECT" \
            --script res://persistent_face_bvh_regression.gd \
            2>&1 | tee jolt-self-face-bvh-refit.log
          grep -Fq 'PASS: Jolt persistent self-face BVH refit and body recreation' jolt-self-face-bvh-refit.log
      - name: Regression-test persistent Jolt self-edge BVH refit and cache eviction
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          PROJECT=tests/stress/jolt_soft_self_persistent_bvh
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://persistent_refit_regression.gd --check-only
          timeout 180s "$BIN" --headless --path "$PROJECT" \
            --script res://persistent_refit_regression.gd \
            2>&1 | tee jolt-self-persistent-bvh.log
          grep -Fq 'PASS: Jolt persistent self-edge BVH refit and body recreation' jolt-self-persistent-bvh.log
      - name: Regression-test Jolt BVH dense self edge collision stability
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          PROJECT=tests/stress/jolt_soft_self_edge_bvh
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://bvh_self_edges_regression.gd --check-only
          timeout 180s "$BIN" --headless --path "$PROJECT" \
            --script res://bvh_self_edges_regression.gd \
            2>&1 | tee jolt-self-edge-bvh.log
          grep -Fq 'PASS: Jolt BVH accelerated self edge collisions' jolt-self-edge-bvh.log
      - name: Regression-test Jolt nonadjacent self edge-edge contacts
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          PROJECT=tests/stress/jolt_soft_self_edges
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://self_edges_regression.gd --check-only
          timeout 180s "$BIN" --headless --path "$PROJECT" \
            --script res://self_edges_regression.gd \
            2>&1 | tee jolt-soft-self-edges.log
          grep -Fq 'PASS: Jolt self edge-edge contacts suppress one-ring adjacency' jolt-soft-self-edges.log
      - name: Regression-test Jolt folded soft-body self collision
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          PROJECT=tests/stress/jolt_soft_self
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://self_collision_regression.gd --check-only
          timeout 180s "$BIN" --headless --path "$PROJECT" \
            --script res://self_collision_regression.gd \
            2>&1 | tee jolt-soft-self-collision.log
          grep -Fq 'PASS: Jolt nonlocal soft self collision and one-ring suppression' jolt-soft-self-collision.log
      - name: Regression-test conservative swept soft-body edge-edge contacts
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          PROJECT=tests/stress/jolt_soft_soft_edge_sweep
          timeout 120s "$BIN" --headless --path "$PROJECT" \
            --script res://swept_edges_regression.gd --check-only
          timeout 180s "$BIN" --headless --path "$PROJECT" \
            --script res://swept_edges_regression.gd \
            2>&1 | tee jolt-soft-soft-edge-sweep.log
          grep -Fq 'PASS: Jolt conservative swept soft-edge contacts and collision filters' jolt-soft-soft-edge-sweep.log
      - name: Regression-test speculative soft-body swept vertex-face contacts
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          PROJECT=tests/stress/jolt_soft_soft_sweep
