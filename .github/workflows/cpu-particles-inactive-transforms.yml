name: CPU particles inactive transform hotpath

on:
  pull_request:
    paths:
      - 'scene/2d/cpu_particles_2d.cpp'
      - 'scene/3d/cpu_particles_3d.cpp'
      - 'misc/scripts/tests/test_cpu_particles_inactive_transform_fastpath.py'
      - '.github/workflows/cpu-particles-inactive-transforms.yml'
  push:
    branches: [develop]
    paths:
      - 'scene/2d/cpu_particles_2d.cpp'
      - 'scene/3d/cpu_particles_3d.cpp'
      - 'misc/scripts/tests/test_cpu_particles_inactive_transform_fastpath.py'
      - '.github/workflows/cpu-particles-inactive-transforms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regressions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s misc/scripts/tests -p test_cpu_particles_inactive_transform_fastpath.py -v

  native-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no -j2
      - name: Headless editor smoke test
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --quit
