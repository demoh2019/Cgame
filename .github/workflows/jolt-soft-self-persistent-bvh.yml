name: Jolt self-collision persistent topology and refit BVH contracts

on:
  pull_request:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/spaces/jolt_space_3d.h"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_soft_self_persistent_bvh.py"
      - "tests/stress/test_jolt_soft_self_edge_bvh.py"
      - "tests/stress/jolt_soft_self_persistent_bvh/**"
      - ".github/workflows/jolt-soft-self-persistent-bvh.yml"
  push:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/spaces/jolt_space_3d.h"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_soft_self_persistent_bvh.py"
      - "tests/stress/test_jolt_soft_self_edge_bvh.py"
      - "tests/stress/jolt_soft_self_persistent_bvh/**"
      - ".github/workflows/jolt-soft-self-persistent-bvh.yml"
  workflow_dispatch:

jobs:
  topology-refit-source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate refit math and previously merged self/interbody physics
        run: |
          python3 -m unittest \
            tests/stress/test_jolt_soft_self_persistent_bvh.py \
            tests/stress/test_jolt_soft_self_edge_bvh.py \
            tests/stress/test_jolt_soft_self_edge_contacts.py \
            tests/stress/test_jolt_soft_self_contacts.py \
            tests/stress/test_jolt_soft_soft_edge_sweep.py \
            tests/stress/test_jolt_soft_soft_speculative_ccd.py \
            tests/stress/test_jolt_soft_soft_edge_edge.py \
            tests/stress/test_jolt_soft_soft_vertex_face.py \
            tests/stress/test_jolt_softsoft_face_bvh.py \
            tests/stress/test_jolt_soft_soft_particle_contacts.py -v
      - name: Check Python syntax and native scene presence
        run: |
          python3 -m py_compile tests/stress/test_jolt_soft_self_persistent_bvh.py
          test -f tests/stress/jolt_soft_self_persistent_bvh/project.godot
          test -f tests/stress/jolt_soft_self_persistent_bvh/persistent_refit_regression.gd
