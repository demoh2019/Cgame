name: LineEdit Caret Idle CPU Regression
on:
  pull_request:
    paths:
      - "scene/gui/line_edit.cpp"
      - "tests/scene/test_control.cpp"
      - ".github/workflows/line-edit-idle-caret-regression.yml"
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: linux-lineedit-caret-native-tests
        continue-on-error: true
      - uses: ./.github/actions/godot-deps
      - name: Compile native tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - uses: ./.github/actions/godot-cache-save
        with:
          cache-name: linux-lineedit-caret-native-tests
        continue-on-error: true
      - name: Test idle LineEdit caret scheduling
        run: ./bin/godot.linuxbsd.editor.x86_64 --headless --test --test-case="*[LineEditCaretIdle]*"
