name: Native Cull Distance Profile and Albion scenery LOD
on:
  pull_request:
    branches: [develop]
    paths:
      - 'modules/cull_distance_policy/**'
      - 'game/scripts/client/scenery_lod.gd'
      - 'game/scripts/client/graphics_quality.gd'
      - 'tests/scene/test_cull_distance_bulk_contract.py'
      - 'game/tests/test_scenery_lod.gd'
      - 'game/tests/run_cull_distance_policy.gd'
      - 'tests/scene/test_cull_distance_cached_contract.py'
      - '.github/workflows/native-cull-distance-policy.yml'
  push:
    branches: [develop]
    paths:
      - 'modules/cull_distance_policy/**'
      - 'game/scripts/client/scenery_lod.gd'
      - 'game/scripts/client/graphics_quality.gd'
      - 'tests/scene/test_cull_distance_bulk_contract.py'
      - 'game/tests/test_scenery_lod.gd'
      - 'game/tests/run_cull_distance_policy.gd'
      - 'tests/scene/test_cull_distance_cached_contract.py'
      - '.github/workflows/native-cull-distance-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-cull-distance:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Cached profile source and game integration contracts
        run: python3 -m unittest tests/scene/test_cull_distance_cached_contract.py tests/scene/test_cull_distance_bulk_contract.py -v
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - name: Native CullDistanceProfile3D doctests
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --test --test-case="*CullDistanceProfile3D*" --no-colors 2>&1 | tee cull-native.log
      - name: Import Albion After game
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee cull-import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' cull-import.log; then exit 1; fi
      - name: Game native/fallback size-profile parity
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 180s "$BIN" --headless --path game --script res://tests/run_cull_distance_policy.gd 2>&1 | tee cull-game.log
          grep -E '^CULL DISTANCE TOTAL: [0-9]+ checks, 0 failures$' cull-game.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' cull-game.log; then exit 1; fi
      - name: Upload cull policy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-cull-distance-policy
          if-no-files-found: ignore
          path: |
            cull-native.log
            cull-import.log
            cull-game.log
