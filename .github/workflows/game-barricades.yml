name: Albion After authoritative barricades

on:
  pull_request:
    paths:
      - "game/scripts/shared/structures.gd"
      - "game/scripts/shared/world_gen.gd"
      - "game/scripts/server/game_server.gd"
      - "game/scripts/shared/net.gd"
      - "game/scripts/client/**"
      - "game/tests/**"
      - "game/README.md"
      - ".github/workflows/game-barricades.yml"
  push:
    branches: [develop]
    paths:
      - "game/scripts/**"
      - "game/tests/**"
      - ".github/workflows/game-barricades.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download SHA-256 verified Godot 4.7.2 compatibility editor
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 -fL -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum --check
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Import local preview and parse all game scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./godot --headless --path game --editor --import --quit 2>&1 | tee game-import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' game-import.log; then exit 1; fi
      - name: Run authoritative game rule and barricade regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s ./godot --headless --path game --script res://tests/run_all.gd 2>&1 | tee game-tests.log
          grep -Fq 'test_barricades.gd' game-tests.log
          grep -Fq 'test_structure_tiers.gd' game-tests.log
          grep -Fq 'test_base_sieges.gd' game-tests.log
          grep -Fq '0 failures' game-tests.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' game-tests.log; then exit 1; fi
      - name: Play the unified game scene headlessly
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./godot --headless --path game --quit-after 45 2>&1 | tee game-smoke.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' game-smoke.log; then exit 1; fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-barricades-logs
          path: |
            game-import.log
            game-tests.log
            game-smoke.log
          if-no-files-found: ignore
