name: TileMap Pattern Preview Crash Regression

on:
  pull_request:
    paths:
      - "modules/tilemap/editor/tiles_editor_plugin.cpp"
      - "modules/tilemap/editor/tiles_editor_plugin.h"
      - "tests/scene/test_tile_pattern_preview.cpp"
      - ".github/workflows/tile-pattern-preview-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tilemap-pattern-preview-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps

      - name: Build Godot editor and tests
        run: scons platform=linuxbsd target=editor tests=yes module_text_server_fb_enabled=yes -j2

      - name: Execute invalid-pattern and preview scaling tests
        shell: bash
        run: |
          set -euo pipefail
          binary="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor.*' -perm /u+x | head -n 1)"
          test -n "$binary"
          "$binary" --headless --test --test-case="*[TilePatternPreview]*"
