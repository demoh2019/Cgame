name: Vulkan small allocation pool regressions
on:
  pull_request:
    branches: [develop]
    paths: ["drivers/vulkan/**", "misc/scripts/tests/test_vulkan_small_allocation_pools.py", ".github/workflows/vulkan-small-allocation-pools.yml"]
  push:
    branches: [develop]
    paths: ["drivers/vulkan/**", "misc/scripts/tests/test_vulkan_small_allocation_pools.py", ".github/workflows/vulkan-small-allocation-pools.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s misc/scripts/tests -p test_vulkan_small_allocation_pools.py -v
  native-vulkan-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
