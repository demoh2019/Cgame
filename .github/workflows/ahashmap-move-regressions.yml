name: AHashMap move assignment native regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - "core/templates/a_hash_map.h"
      - "tests/core/templates/test_a_hash_map.cpp"
      - ".github/workflows/ahashmap-move-regressions.yml"
  push:
    branches: [develop]
    paths:
      - "core/templates/a_hash_map.h"
      - "tests/core/templates/test_a_hash_map.cpp"
      - ".github/workflows/ahashmap-move-regressions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-cpp:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build test-enabled Linux Godot editor
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Run AHashMap native doctest suite
        run: timeout 180s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[AHashMap]*"
