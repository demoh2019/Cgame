name: FileAccess UTF-8 stack-buffer performance regression

on:
  pull_request:
    branches: [develop]
    paths:
      - "core/io/file_access.cpp"
      - "tests/core/io/test_file_access.cpp"
      - ".github/workflows/file-access-small-utf8.yml"
  push:
    branches: [develop]
    paths:
      - "core/io/file_access.cpp"
      - "tests/core/io/test_file_access.cpp"
      - ".github/workflows/file-access-small-utf8.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-small-utf8:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Test short and large UTF-8 loading and partial reads
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*Small UTF-8 loads avoid*" --no-colors
