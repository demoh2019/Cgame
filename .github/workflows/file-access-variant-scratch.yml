name: FileAccess Variant scratch buffer regression

on:
  pull_request:
    branches: [develop]
    paths:
      - "core/io/file_access.cpp"
      - "tests/core/io/test_file_access.cpp"
      - ".github/workflows/file-access-variant-scratch.yml"
  push:
    branches: [develop]
    paths:
      - "core/io/file_access.cpp"
      - "tests/core/io/test_file_access.cpp"
      - ".github/workflows/file-access-variant-scratch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  variant-serialization-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Verify FileAccess Variant wire format and malformed lengths
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*Variant serialization uses small scratch*" --no-colors
