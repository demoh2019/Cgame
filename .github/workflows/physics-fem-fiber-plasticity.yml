name: FEM tetra fiber plastic remodeling regression

on:
  pull_request:
    paths:
      - "servers/physics_fem_tetra_fiber_plasticity.h"
      - "servers/physics_fem_tetra_fiber.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_fem_tetra_fiber_plasticity.cpp"
      - "tests/stress/test_physics_fem_tetra_fiber_plasticity.py"
      - ".github/workflows/physics-fem-fiber-plasticity.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_fem_tetra_fiber_plasticity.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/stress/test_physics_fem_tetra_fiber_plasticity.py"
      - ".github/workflows/physics-fem-fiber-plasticity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fiber-physics-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Numerical reference and engine wiring
        run: python3 -m unittest discover -s tests/stress -p test_physics_fem_tetra_fiber_plasticity.py -v
