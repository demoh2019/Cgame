name: Physics XPBD compression buckling source contracts

on:
  pull_request:
    paths:
      - "servers/physics_xpbd_compression_buckling.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/servers/test_physics_xpbd_compression_buckling.cpp"
      - "tests/stress/test_physics_xpbd_compression_buckling.py"
      - ".github/workflows/physics-xpbd-compression-buckling.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_xpbd_compression_buckling.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/stress/test_physics_xpbd_compression_buckling.py"
      - ".github/workflows/physics-xpbd-compression-buckling.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compressive material law and source integration
        run: python3 -m unittest discover -s tests/stress -p test_physics_xpbd_compression_buckling.py -v
