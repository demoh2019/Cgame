name: SceneTree group zero-copy regression

on:
  pull_request:
    paths:
      - "scene/main/scene_tree.cpp"
      - "tests/scene/test_scene_tree_group_snapshots.cpp"
      - "misc/scripts/tests/test_scene_tree_group_cow.py"
      - ".github/workflows/perf-scene-tree-group-cow.yml"
  push:
    branches: [develop]
    paths:
      - "scene/main/scene_tree.cpp"
      - "tests/scene/test_scene_tree_group_snapshots.cpp"
      - "misc/scripts/tests/test_scene_tree_group_cow.py"
      - ".github/workflows/perf-scene-tree-group-cow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check Python regression tests
        run: python3 -m unittest discover -s misc/scripts/tests -p 'test_scene_tree_group_cow.py' -v

  native-godot-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin
      - uses: ./.github/actions/godot-deps
      - name: Compile Cgame editor with native tests enabled
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes debug_symbols=no tests=yes module_text_server_fb_enabled=yes -j2
      - name: Execute SceneTree group snapshot and COW regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-suite="*[SceneTreeGroupCOW]*" --no-colors
