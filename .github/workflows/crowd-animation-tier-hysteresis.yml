name: Native crowd animation LOD hysteresis and game parity

on:
  pull_request:
    branches: [develop]
    paths:
      - 'modules/crowd_animation_tier_planner/**'
      - 'tests/scene/test_crowd_animation_tier_planner.cpp'
      - 'tests/scene/test_crowd_animation_tier_contract.py'
      - 'game/scripts/client/character_anim.gd'
      - 'game/tests/test_crowd_animation_tier_planner.gd'
      - 'game/tests/run_crowd_animation_tier.gd'
      - '.github/workflows/crowd-animation-tier-hysteresis.yml'
  push:
    branches: [develop]
    paths:
      - 'modules/crowd_animation_tier_planner/**'
      - 'tests/scene/test_crowd_animation_tier_planner.cpp'
      - 'tests/scene/test_crowd_animation_tier_contract.py'
      - 'game/scripts/client/character_anim.gd'
      - 'game/tests/test_crowd_animation_tier_planner.gd'
      - 'game/tests/run_crowd_animation_tier.gd'
      - '.github/workflows/crowd-animation-tier-hysteresis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify deterministic crowd tier source contract
        run: python3 -m unittest tests/scene/test_crowd_animation_tier_contract.py -v

  native-and-game:
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - name: Native crowd LOD C++ regression suite
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --test --test-case="*[CrowdAnimationTierPlanner]*" 2>&1 | tee crowd-native.log
          if grep -Ei 'FAILED|failed assertions|test cases:.*failed' crowd-native.log; then exit 1; fi
      - name: Import Albion After project
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee crowd-import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' crowd-import.log; then exit 1; fi
      - name: Headless native and fallback LOD parity
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --path game --script res://tests/run_crowd_animation_tier.gd 2>&1 | tee crowd-game.log
          grep -E '^CROWD LOD TOTAL: [0-9]+ checks, 0 failures$' crowd-game.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' crowd-game.log; then exit 1; fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crowd-lod-hysteresis-regression
          if-no-files-found: ignore
          path: |
            crowd-native.log
            crowd-import.log
            crowd-game.log
