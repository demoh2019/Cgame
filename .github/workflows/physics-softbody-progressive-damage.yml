name: SoftBody progressive tensile damage contracts

on:
  pull_request:
    paths:
      - "servers/physics_softbody_progressive_damage.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "tests/servers/test_physics_softbody_progressive_damage.cpp"
      - "tests/stress/test_physics_softbody_progressive_damage.py"
      - ".github/workflows/physics-softbody-progressive-damage.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_softbody_progressive_damage.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/stress/test_physics_softbody_progressive_damage.py"
      - ".github/workflows/physics-softbody-progressive-damage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check irreversible material damage and GodotPhysics3D XPBD integration
        run: python3 -m unittest discover -s tests/stress -p test_physics_softbody_progressive_damage.py -v
