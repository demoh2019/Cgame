name: Compressed file block-table allocation regression

on:
  pull_request:
    branches: [develop]
    paths:
      - "core/io/file_access_compressed.cpp"
      - "tests/core/io/test_file_access.cpp"
      - ".github/workflows/compressed-file-block-tables.yml"
  push:
    branches: [develop]
    paths:
      - "core/io/file_access_compressed.cpp"
      - "tests/core/io/test_file_access.cpp"
      - ".github/workflows/compressed-file-block-tables.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-compressed-block-tables:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Verify FastLZ and Zstandard multi-block roundtrips
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*Compressed block tables preserve*" --no-colors
