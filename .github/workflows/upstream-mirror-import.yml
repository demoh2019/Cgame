name: Upstream Issue and PR Mirror

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all, issues, open-prs, or archive-prs"
        type: choice
        required: true
        default: "all"
        options:
          - all
          - issues
          - open-prs
          - archive-prs
      max_new:
        description: "Maximum NEW records per run (0 = unlimited, potentially very slow)"
        type: number
        required: true
        default: 25
      skip_comments:
        description: "Skip copying issue/PR conversation comments"
        type: boolean
        required: true
        default: false
      allow_untrusted_pr_import:
        description: "I reviewed Actions and secrets and accept the risk of importing untrusted PR branches"
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-godot-mirror
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Import with resume state
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN || github.token }}
          IMPORT_MODE: ${{ inputs.mode }}
          MAX_NEW: ${{ inputs.max_new }}
          SKIP_COMMENTS: ${{ inputs.skip_comments }}
          ALLOW_UNTRUSTED: ${{ inputs.allow_untrusted_pr_import }}
        shell: bash
        run: |
          args=(--mode "$IMPORT_MODE" --max-new "$MAX_NEW" --state .github/upstream-mirror-state.json)
          if [[ "$SKIP_COMMENTS" == "true" ]]; then args+=(--skip-comments); fi
          if [[ "$ALLOW_UNTRUSTED" == "true" ]]; then args+=(--allow-untrusted-pr-import); fi
          python3 misc/scripts/mirror_upstream_github.py "${args[@]}"

      - name: Save checkpoint even after partial failures
        if: always()
        shell: bash
        run: |
          if [[ -f .github/upstream-mirror-state.json ]]; then
            git config user.name "godot-mirror[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/upstream-mirror-state.json
            if ! git diff --cached --quiet; then
              git commit -m "Checkpoint upstream issue and PR mirror progress"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
