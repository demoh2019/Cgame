name: PacketPeer framed bulk-copy regression

on:
  pull_request:
    branches: [develop]
    paths:
      - "core/io/packet_peer.cpp"
      - "tests/core/io/test_packet_peer.cpp"
      - ".github/workflows/packet-peer-bulk-copy.yml"
  push:
    branches: [develop]
    paths:
      - "core/io/packet_peer.cpp"
      - "tests/core/io/test_packet_peer.cpp"
      - ".github/workflows/packet-peer-bulk-copy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  framed-packet-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Run native PacketPeer framing and copy tests
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[PacketPeer]*" --no-colors
