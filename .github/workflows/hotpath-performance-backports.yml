name: Godot hot-path performance regression checks

on:
  push:
    branches: [develop]
    paths:
      - 'core/templates/sort_array.h'
      - 'scene/gui/graph_edit.cpp'
      - 'scene/gui/graph_edit.h'
      - 'modules/gdscript/gdscript.cpp'
      - 'editor/audio/audio_stream_preview.cpp'
      - 'tests/core/templates/test_sort_array.cpp'
      - 'misc/scripts/tests/test_hotpath_performance_backports.py'
      - '.github/workflows/hotpath-performance-backports.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'core/templates/sort_array.h'
      - 'scene/gui/graph_edit.cpp'
      - 'scene/gui/graph_edit.h'
      - 'modules/gdscript/gdscript.cpp'
      - 'editor/audio/audio_stream_preview.cpp'
      - 'tests/core/templates/test_sort_array.cpp'
      - 'misc/scripts/tests/test_hotpath_performance_backports.py'
      - '.github/workflows/hotpath-performance-backports.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-cpp-regressions:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax plus compiled production C++ regression harnesses
        run: |
          python -m py_compile misc/scripts/tests/test_hotpath_performance_backports.py
          python -m unittest discover -s misc/scripts/tests -p test_hotpath_performance_backports.py -v
