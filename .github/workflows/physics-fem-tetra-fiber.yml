name: FEM tetrahedral material fiber regression

on:
  pull_request:
    paths:
      - "servers/physics_fem_tetra_fiber.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_fem_tetra_fiber.cpp"
      - "tests/stress/test_physics_fem_tetra_fiber.py"
      - ".github/workflows/physics-fem-tetra-fiber.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_fem_tetra_fiber.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/stress/test_physics_fem_tetra_fiber.py"
      - ".github/workflows/physics-fem-tetra-fiber.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check fiber stretch and code wiring
        run: python3 -m unittest discover -s tests/stress -p test_physics_fem_tetra_fiber.py -v
