name: PBF 3D vorticity and finite-energy restoration

on:
  pull_request:
    paths:
      - "servers/physics_pbf_vorticity_3d.h"
      - "scene/3d/physics/pbf_particle_fluid_3d.h"
      - "scene/3d/physics/pbf_particle_fluid_3d.cpp"
      - "tests/servers/test_physics_pbf_vorticity_3d.cpp"
      - "tests/stress/test_physics_pbf_vorticity_3d.py"
      - "tests/stress/test_physics_pbf_vorticity_compiler.cpp"
      - "tests/stress/physics_pbf_vorticity_3d_regression.gd"
      - "tests/stress/physics_pbf_particle_fluid_stress.gd"
      - "tests/stress/run.py"
      - "tests/stress/stress.gd"
      - "doc/classes/PBFParticleFluid3D.xml"
      - "demo/physics_lab/pbf_water_3d.gd"
      - ".github/workflows/physics-pbf-vorticity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vorticity-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual PBF vorticity header in float32 and float64
        run: |
          for precision in float double; do
            flags=""
            if [ "$precision" = "double" ]; then flags="-DCGAME_USE_DOUBLE"; fi
            g++ -std=c++17 -O2 -Wall -Wextra -Werror $flags \
              -Itests/stress/physics_pbf_cpp_stubs -I. \
              tests/stress/test_physics_pbf_vorticity_compiler.cpp \
              -o "/tmp/physics_pbf_vorticity_$precision"
            "/tmp/physics_pbf_vorticity_$precision"
          done
      - name: Independent randomized curl sign, shear and bounded-vorticity reference
        run: python3 -m unittest discover -s tests/stress -p test_physics_pbf_vorticity_3d.py -v
