name: Streaming decompression buffer and corruption regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - "core/io/compression.cpp"
      - "tests/core/io/test_compression.cpp"
      - ".github/workflows/dynamic-decompress-bounds.yml"
  push:
    branches: [develop]
    paths:
      - "core/io/compression.cpp"
      - "tests/core/io/test_compression.cpp"
      - ".github/workflows/dynamic-decompress-bounds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-decompress:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Check streaming gzip/deflate and Brotli allocation limits
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[Compression]*" --no-colors
