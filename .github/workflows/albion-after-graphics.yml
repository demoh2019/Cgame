name: Albion After graphics regression (Godot)

on:
  push:
    branches: [develop]
    paths:
      - 'game/scripts/client/**'
      - 'game/assets/shaders/**'
      - 'game/tests/**'
      - 'tools/compare_frame_pacing.py'
      - 'tools/tests/test_compare_frame_pacing.py'
      - 'game/project.godot'
      - 'servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp'
      - 'servers/rendering/renderer_rd/effects/fsr2.cpp'
      - 'tests/servers/rendering/test_fsr2_camera_history.py'
      - 'servers/rendering/renderer_rd/shaders/effects/ssao_blur.glsl'
      - 'servers/rendering/renderer_rd/shaders/effects/ssil_blur.glsl'
      - 'tests/servers/rendering/test_ao_blur_bounds.py'
      - 'servers/rendering/renderer_rd/shaders/effects/screen_space_reflection_resolve.glsl'
      - 'tests/servers/rendering/test_ssr_half_resolve.py'
      - 'tests/servers/rendering/test_pbr_reflection_occlusion.py'
      - 'servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl'
      - '.github/workflows/albion-after-graphics.yml'
  pull_request:
    paths:
      - 'game/scripts/client/**'
      - 'game/assets/shaders/**'
      - 'game/tests/**'
      - 'tools/compare_frame_pacing.py'
      - 'tools/tests/test_compare_frame_pacing.py'
      - 'game/project.godot'
      - 'servers/rendering/renderer_rd/forward_clustered/render_forward_clustered.cpp'
      - 'servers/rendering/renderer_rd/effects/fsr2.cpp'
      - 'tests/servers/rendering/test_fsr2_camera_history.py'
      - 'servers/rendering/renderer_rd/shaders/effects/ssao_blur.glsl'
      - 'servers/rendering/renderer_rd/shaders/effects/ssil_blur.glsl'
      - 'tests/servers/rendering/test_ao_blur_bounds.py'
      - 'servers/rendering/renderer_rd/shaders/effects/screen_space_reflection_resolve.glsl'
      - 'tests/servers/rendering/test_ssr_half_resolve.py'
      - 'tests/servers/rendering/test_pbr_reflection_occlusion.py'
      - 'servers/rendering/renderer_rd/shaders/forward_clustered/scene_forward_clustered.glsl'
      - '.github/workflows/albion-after-graphics.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphics-godot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphics-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout only Albion After game
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            game
            tools
            servers/rendering/renderer_rd/shaders/effects
            servers/rendering/renderer_rd/shaders/forward_clustered
            servers/rendering/renderer_rd/forward_clustered
            servers/rendering/renderer_rd/effects
            thirdparty/amd-fsr2
            tests/servers/rendering
            tests/scene
          sparse-checkout-cone-mode: true

      - name: Validate in-game Settings wiring and persistence contracts
        shell: bash
        run: python3 -m unittest tests/scene/test_albion_settings_menu_contract.py -v

      - name: Validate native SSR half-resolution reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/servers/rendering/test_ssr_half_resolve.py -v 2>&1 | tee ssr-engine-tests.log
          python3 -m unittest tests/servers/rendering/test_ao_blur_bounds.py -v 2>&1 | tee ao-engine-tests.log

      - name: Validate native SDFGI glossy continuity and PBR visibility
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/servers/rendering/test_pbr_reflection_occlusion.py -v 2>&1 | tee pbr-reflection-tests.log

      - name: Validate FSR2 camera-cut temporal history and millisecond timing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/servers/rendering/test_fsr2_camera_history.py -v 2>&1 | tee fsr2-history-tests.log

      - name: Verify reusable CPU/GPU benchmark comparison tool
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_compare_frame_pacing.py' -v 2>&1 | tee benchmark-compare-tests.log

      - name: Install verified official Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 -fL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum --check --status
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          ./godot --version

      - name: Import game resources and catch GDScript parse errors
        shell: bash
        run: |
          set -euo pipefail
          timeout 360s ./godot --headless --path game --editor --import --quit 2>&1 | tee graphics-import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' graphics-import.log; then exit 1; fi

      - name: Execute renderer and lightning regression suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s ./godot --headless --path game --script res://tests/run_graphics.gd 2>&1 | tee graphics-tests.log
          grep -E '^GRAPHICS TOTAL: [0-9]+ checks, 0 failures$' graphics-tests.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' graphics-tests.log; then exit 1; fi

      - name: Focused Settings, audio and graphics regression
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s ./godot --headless --path game --script res://tests/run_one.gd -- test_ui_parity test_audio_parity test_graphics_quality 2>&1 | tee ui-settings-tests.log
          grep -E '^TOTAL [0-9]+ checks, 0 failures$' ui-settings-tests.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' ui-settings-tests.log; then exit 1; fi

      - name: Upload graphics regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: albion-after-graphics-logs
          if-no-files-found: ignore
          path: |
            graphics-import.log
            graphics-tests.log
            ui-settings-tests.log
            ssr-engine-tests.log
            fsr2-history-tests.log
            pbr-reflection-tests.log
            ao-engine-tests.log
            benchmark-compare-tests.log
