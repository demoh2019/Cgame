name: PackedScene in-place container instantiation regressions

on:
  pull_request:
    paths:
      - 'scene/resources/packed_scene.cpp'
      - 'scene/resources/packed_scene.h'
      - 'tests/scene/test_packed_scene.cpp'
      - '.github/workflows/packed-scene-inplace-fastpath.yml'
  push:
    branches: [develop]
    paths:
      - 'scene/resources/packed_scene.cpp'
      - 'scene/resources/packed_scene.h'
      - 'tests/scene/test_packed_scene.cpp'
      - '.github/workflows/packed-scene-inplace-fastpath.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-scene-instantiation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build engine with native tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Exercise container and scene-local Resource cloning
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[PackedScene] In-place container instantiation preserves metadata and local resources*"
