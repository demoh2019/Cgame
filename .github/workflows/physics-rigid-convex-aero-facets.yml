name: GodotPhysics3D convex-hull aerodynamic facet contracts

on:
  pull_request:
    paths:
      - "servers/physics_rigid_convex_aero_facets_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "modules/godot_physics_3d/godot_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "tests/servers/test_physics_rigid_convex_aero_facets_3d.cpp"
      - "tests/stress/test_physics_rigid_convex_aero_facets_3d.py"
      - ".github/workflows/physics-rigid-convex-aero-facets.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_rigid_convex_aero_facets_3d.h"
      - "modules/godot_physics_3d/godot_body_3d.cpp"
      - "tests/stress/test_physics_rigid_convex_aero_facets_3d.py"
      - ".github/workflows/physics-rigid-convex-aero-facets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate hull face aerodynamics, integration and source contracts
        run: python3 -m unittest discover -s tests/stress -p test_physics_rigid_convex_aero_facets_3d.py -v
