name: Upstream AI asset preference and export logging

on:
  push:
    branches: [develop]
    paths:
      - 'editor/asset_library/asset_library_editor_plugin.cpp'
      - 'editor/asset_library/asset_library_editor_plugin.h'
      - 'editor/export/editor_export_platform_pc.cpp'
      - 'platform/macos/export/export_plugin.cpp'
      - 'misc/scripts/tests/test_upstream_asset_ai_export_logging.py'
      - '.github/workflows/upstream-asset-ai-export-logging.yml'
  pull_request:
    paths:
      - 'editor/asset_library/asset_library_editor_plugin.cpp'
      - 'editor/asset_library/asset_library_editor_plugin.h'
      - 'editor/export/editor_export_platform_pc.cpp'
      - 'platform/macos/export/export_plugin.cpp'
      - 'misc/scripts/tests/test_upstream_asset_ai_export_logging.py'
      - '.github/workflows/upstream-asset-ai-export-logging.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-contracts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python source-contract tests
        run: python -m py_compile misc/scripts/tests/test_upstream_asset_ai_export_logging.py
      - name: Check AI search filtering and export warnings
        run: python -m unittest discover -s misc/scripts/tests -p test_upstream_asset_ai_export_logging.py -v

  native-cgame-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux editor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin
      - uses: ./.github/actions/godot-deps
      - name: Compile the Cgame editor from this commit
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes debug_symbols=no tests=yes module_text_server_fb_enabled=yes -j2
      - name: Headless editor import sanity check
        shell: bash
        run: |
          set -euo pipefail
          DIR="$(mktemp -d)"
          trap 'rm -rf "$DIR"' EXIT
          printf 'config_version=5\n[application]\nconfig/name="AI Asset Preference Backport"\n' > "$DIR/project.godot"
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          "$BIN" --version
          timeout 45s "$BIN" --headless --editor --path "$DIR" --import --quit 2>&1 | tee asset_ai_editor_smoke.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' asset_ai_editor_smoke.log; then
            exit 1
          fi
