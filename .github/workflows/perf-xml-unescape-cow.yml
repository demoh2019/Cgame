name: XML unescape zero-copy fast path regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - 'core/string/ustring.cpp'
      - 'tests/core/string/test_string.cpp'
      - '.github/workflows/perf-xml-unescape-cow.yml'
  push:
    branches: [develop]
    paths:
      - 'core/string/ustring.cpp'
      - 'tests/core/string/test_string.cpp'
      - '.github/workflows/perf-xml-unescape-cow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-xml-unescape:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build native editor and C++ doctests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Run XML escaping and unescaping native cases
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          "$BIN" --headless --test --test-case="*xml_unescape*" --no-colors
          "$BIN" --headless --test --test-case="*[XMLParser]*" --no-colors
