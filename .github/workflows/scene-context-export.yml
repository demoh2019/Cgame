name: Scene-aware AI context exporter
on:
  push:
    branches: [develop]
    paths:
      - 'misc/scripts/scene_context_export.py'
      - 'misc/scripts/tests/test_scene_context_export.py'
      - 'misc/scripts/README_scene_context_export.md'
      - '.github/workflows/scene-context-export.yml'
  pull_request:
    paths:
      - 'misc/scripts/scene_context_export.py'
      - 'misc/scripts/tests/test_scene_context_export.py'
      - 'misc/scripts/README_scene_context_export.md'
      - '.github/workflows/scene-context-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python-regressions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax and scene context regressions
        run: |
          python -m py_compile misc/scripts/scene_context_export.py misc/scripts/tests/test_scene_context_export.py
          python -m unittest discover -s misc/scripts/tests -p test_scene_context_export.py -v
