name: Albion After server-authoritative safe stash

on:
  pull_request:
    paths:
      - 'game/scripts/server/game_server.gd'
      - 'game/scripts/shared/defs.gd'
      - 'game/scripts/shared/net.gd'
      - 'game/scripts/client/**'
      - 'game/tests/**'
      - 'game/README.md'
      - '.github/workflows/albion-after-safe-stash.yml'
  push:
    branches: [develop]
    paths:
      - 'game/scripts/server/game_server.gd'
      - 'game/scripts/shared/defs.gd'
      - 'game/scripts/shared/net.gd'
      - 'game/scripts/client/**'
      - 'game/tests/**'
      - 'game/README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authoritative-game-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch SHA-256 verified official Godot 4.7.2 compatibility editor
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 -fL -o godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Run real server gameplay rules and bank regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s ./godot --headless --path game \
            --script res://tests/run_all.gd 2>&1 | tee albion-after-stash-tests.log
          grep -Fq 'test_secure_stash.gd' albion-after-stash-tests.log
          grep -Fq '0 failures' albion-after-stash-tests.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|FAIL ' albion-after-stash-tests.log; then
            exit 1
          fi
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: albion-after-stash-test-logs
          if-no-files-found: ignore
          path: albion-after-stash-tests.log
