name: P1 virtual geometry attribute fidelity and Albion scenery LOD

on:
  pull_request:
    branches: [develop]
    paths:
      - 'modules/cgame_virtual_geometry/**'
      - 'game/scripts/client/mesh_lod_preservation.gd'
      - 'game/scripts/client/model_catalog.gd'
      - 'game/tests/test_virtual_geometry_attribute_lod.gd'
      - 'game/tests/run_all.gd'
      - 'game/docs/p1_nanite_attribute_preservation.md'
      - 'tests/scene/test_virtual_geometry_attribute_contract.py'
      - '.github/workflows/native-virtual-geometry-attribute-lod.yml'
  push:
    branches: [develop]
    paths:
      - 'modules/cgame_virtual_geometry/**'
      - 'game/scripts/client/mesh_lod_preservation.gd'
      - 'game/scripts/client/model_catalog.gd'
      - 'game/tests/test_virtual_geometry_attribute_lod.gd'
      - 'game/tests/run_all.gd'
      - 'game/docs/p1_nanite_attribute_preservation.md'
      - 'tests/scene/test_virtual_geometry_attribute_contract.py'
      - '.github/workflows/native-virtual-geometry-attribute-lod.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-attributed-lod:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Source contract for native attr-aware meshoptimizer and real game PBR
        run: python3 -m unittest tests/scene/test_virtual_geometry_attribute_contract.py -v
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - name: C++ attribute preservation and invalid input regressions
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --test --test-case="*CgameClusterLOD*attribute*" --no-colors 2>&1 | tee virtual-geometry-attribute-native.log
      - name: Import Albion After and reject source parsing errors
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee virtual-geometry-attribute-import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' virtual-geometry-attribute-import.log; then exit 1; fi
      - name: Albion PBR and production scatter triangle budgeting
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --path game --script res://tests/run_one.gd -- test_virtual_geometry_attribute_lod test_mesh_pbr_preservation test_imported_mesh_lod 2>&1 | tee virtual-geometry-attribute-game.log
          grep -E '^TOTAL [0-9]+ checks, 0 failures$' virtual-geometry-attribute-game.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' virtual-geometry-attribute-game.log; then exit 1; fi
      - name: Save native and game regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-geometry-attribute-lod-logs
          if-no-files-found: ignore
          path: |
            virtual-geometry-attribute-native.log
            virtual-geometry-attribute-import.log
            virtual-geometry-attribute-game.log
