name: Native terrain auto-collision and Albion After authoring

on:
  pull_request:
    branches: [develop]
    paths:
      - 'modules/heightmap_terrain/**'
      - 'game/scripts/client/terrain_collision_authoring.gd'
      - 'game/tools/terrain_collision_probe.gd'
      - 'game/tests/test_terrain_auto_collision.gd'
      - 'game/tests/run_all.gd'
      - 'tests/scene/test_terrain_auto_collision_contract.py'
      - '.github/workflows/native-terrain-auto-collision.yml'
  push:
    branches: [develop]
    paths:
      - 'modules/heightmap_terrain/**'
      - 'game/scripts/client/terrain_collision_authoring.gd'
      - 'game/tools/terrain_collision_probe.gd'
      - 'game/tests/test_terrain_auto_collision.gd'
      - 'game/tests/run_all.gd'
      - 'tests/scene/test_terrain_auto_collision_contract.py'
      - '.github/workflows/native-terrain-auto-collision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Source contracts (not a runtime substitute)
        run: python3 -m unittest tests/scene/test_terrain_auto_collision_contract.py -v

  native-game:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - name: Native heightfield collision, sculpt and coarse budgets
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --test --test-case="*[Terrain]*" --no-colors 2>&1 | tee terrain-native.log
          if grep -Ei 'FAILED|failed assertions|test cases:.*failed' terrain-native.log; then exit 1; fi
      - name: Import Albion After game
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee terrain-import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' terrain-import.log; then exit 1; fi
      - name: Actual Albion world source to native terrain and collision
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 300s "$BIN" --headless --path game --script res://tests/run_one.gd -- test_terrain_auto_collision 2>&1 | tee terrain-game.log
          grep -E '^TOTAL [0-9]+ checks, 0 failures$' terrain-game.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' terrain-game.log; then exit 1; fi
      - name: Full Albion After headless regression
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 600s "$BIN" --headless --path game --script res://tests/run_all.gd 2>&1 | tee terrain-full.log
          grep -E '^TOTAL [0-9]+ checks, 0 failures$' terrain-full.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' terrain-full.log; then exit 1; fi
      - name: Archive native terrain test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terrain-auto-collision-tests
          if-no-files-found: ignore
          path: |
            terrain-native.log
            terrain-import.log
            terrain-game.log
            terrain-full.log
