name: Physics XPBD self-contact friction source tests

on:
  pull_request:
    paths:
      - "servers/physics_xpbd_self_friction.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_xpbd_self_friction.cpp"
      - "tests/stress/test_physics_xpbd_self_friction.py"
      - ".github/workflows/physics-xpbd-self-friction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate mass-weighted friction and integration contracts
        run: python3 -m unittest discover -s tests/stress -p test_physics_xpbd_self_friction.py -v
