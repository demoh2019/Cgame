name: Jolt self edge contact topology and impulse reference

on:
  pull_request:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_soft_self_edge_contacts.py"
      - "tests/stress/jolt_soft_self_edges/**"
      - ".github/workflows/jolt-soft-self-edge-contacts.yml"
  push:
    branches: [develop]
    paths:
      - "modules/jolt_physics/spaces/jolt_space_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_soft_self_edge_contacts.py"
      - "tests/stress/jolt_soft_self_edges/**"
      - ".github/workflows/jolt-soft-self-edge-contacts.yml"
  workflow_dispatch:

jobs:
  nonlocal-self-edge-topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-edge math, self-face topology and legacy soft physics contracts
        run: |
          python3 -m unittest \
            tests/stress/test_jolt_soft_self_edge_contacts.py \
            tests/stress/test_jolt_soft_self_contacts.py \
            tests/stress/test_jolt_soft_soft_edge_sweep.py \
            tests/stress/test_jolt_soft_soft_speculative_ccd.py \
            tests/stress/test_jolt_soft_soft_edge_edge.py \
            tests/stress/test_jolt_soft_soft_vertex_face.py \
            tests/stress/test_jolt_softsoft_face_bvh.py \
            tests/stress/test_jolt_soft_soft_particle_contacts.py -v
      - name: Verify Python syntax and native fixture assets
        run: |
          python3 -m py_compile tests/stress/test_jolt_soft_self_edge_contacts.py
          test -f tests/stress/jolt_soft_self_edges/project.godot
          test -f tests/stress/jolt_soft_self_edges/self_edges_regression.gd
