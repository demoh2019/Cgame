name: XPBD SoftBody self-collision scale contracts

on:
  pull_request:
    paths:
      - "servers/physics_xpbd_self_collision.h"
      - "servers/physics_xpbd_self_friction.h"
      - "tests/servers/test_physics_xpbd_self_collision_scale.cpp"
      - "tests/stress/test_physics_xpbd_self_collision_scale.py"
      - ".github/workflows/physics-xpbd-self-collision-scale.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numeric-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scale-robust XPBD self-contact source contracts
        run: python3 -m unittest discover -s tests/stress -p test_physics_xpbd_self_collision_scale.py -v
