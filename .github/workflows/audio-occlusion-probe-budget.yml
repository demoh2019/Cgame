name: Native age-fair audio occlusion probes

on:
  push:
    branches: [develop]
    paths:
      - 'modules/gameplay_fx/**'
      - 'game/scripts/client/audio.gd'
      - 'game/scripts/client/audio_occlusion_probes.gd'
      - 'game/tests/test_audio_occlusion_probe_planner.gd'
      - 'game/tests/run_audio.gd'
      - 'game/tests/run_all.gd'
      - 'tests/scene/test_audio_occlusion_probe_planner_contract.py'
      - '.github/workflows/audio-occlusion-probe-budget.yml'
  pull_request:
    paths:
      - 'modules/gameplay_fx/**'
      - 'game/scripts/client/audio.gd'
      - 'game/scripts/client/audio_occlusion_probes.gd'
      - 'game/tests/test_audio_occlusion_probe_planner.gd'
      - 'game/tests/run_audio.gd'
      - 'game/tests/run_all.gd'
      - 'tests/scene/test_audio_occlusion_probe_planner_contract.py'
      - '.github/workflows/audio-occlusion-probe-budget.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate source contracts
        run: python3 -m unittest tests/scene/test_audio_occlusion_probe_planner_contract.py -v

  native-game:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - name: Native age-fair audio probes
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --test --test-case="*[AudioOcclusionProbePlanner]*" 2>&1 | tee probe-native.log
          if grep -Ei 'FAILED|failed assertions|test cases:.*failed' probe-native.log; then exit 1; fi
      - name: Import Albion After
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee probe-import.log
      - name: Focused audio regression suite
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --path game --script res://tests/run_audio.gd 2>&1 | tee probe-game.log
          grep -E '^AUDIO TOTAL: [0-9]+ checks, 0 failures$' probe-game.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' probe-game.log; then exit 1; fi
      - name: Full Albion After headless suite
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 600s "$BIN" --headless --path game --script res://tests/run_all.gd 2>&1 | tee probe-full.log
          grep -E '^TOTAL [0-9]+ checks, 0 failures$' probe-full.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' probe-full.log; then exit 1; fi
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-occlusion-probe-regressions
          if-no-files-found: ignore
          path: |
            probe-native.log
            probe-import.log
            probe-game.log
            probe-full.log
