name: Material3D texture-aware shader specialization regressions

on:
  pull_request:
    paths:
      - 'scene/resources/material.cpp'
      - 'scene/resources/material.h'
      - 'tests/scene/test_material_texture_shader.cpp'
      - '.github/workflows/material3d-texture-specialization.yml'
  push:
    branches: [develop]
    paths:
      - 'scene/resources/material.cpp'
      - 'scene/resources/material.h'
      - 'tests/scene/test_material_texture_shader.cpp'
      - '.github/workflows/material3d-texture-specialization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-material-specialization:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build native editor and shader compiler tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Compile material shader variants with and without texture maps
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[SceneTree][Material3D]*"
