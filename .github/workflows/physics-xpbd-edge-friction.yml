name: Physics XPBD structural edge friction contracts

on:
  pull_request:
    paths:
      - "servers/physics_xpbd_edge_friction.h"
      - "servers/physics_xpbd_edge_collision.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/servers/test_physics_xpbd_edge_friction.cpp"
      - "tests/stress/test_physics_xpbd_edge_friction.py"
      - ".github/workflows/physics-xpbd-edge-friction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Coulomb budget, momentum and source wiring
        run: python3 -m unittest discover -s tests/stress -p test_physics_xpbd_edge_friction.py -v
