name: Native multi-viewer significance and torch parity

on:
  pull_request:
    branches: [develop]
    paths:
      - 'modules/significance_budget/**'
      - 'game/scripts/client/dungeon_light_budget.gd'
      - 'game/tests/test_dungeon_light_budget.gd'
      - '.github/workflows/native-significance-multiview.yml'
  push:
    branches: [develop]
    paths:
      - 'modules/significance_budget/**'
      - 'game/scripts/client/dungeon_light_budget.gd'
      - 'game/tests/test_dungeon_light_budget.gd'
      - '.github/workflows/native-significance-multiview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable-world-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - name: Native significance regressions
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --test --test-case="*SignificanceBudget*" 2>&1 | tee significance-native.log
      - name: Import and parse game
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee significance-import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' significance-import.log; then exit 1; fi
      - name: Dungeon light native and fallback parity
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 180s "$BIN" --headless --path game --script res://tests/run_dungeon_light_budget.gd 2>&1 | tee significance-light.log
          grep -E '^SIGNIFICANCE LIGHTS TOTAL: [0-9]+ checks, 0 failures$' significance-light.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' significance-light.log; then exit 1; fi
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-viewer-significance-logs
          if-no-files-found: ignore
          path: |
            significance-native.log
            significance-import.log
            significance-light.log
