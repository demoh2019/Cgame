name: SoftBody3D hydrostatic buoyancy contracts

on:
  pull_request:
    paths:
      - "servers/physics_softbody_hydrostatic_buoyancy.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/stress/test_physics_softbody_hydrostatic_buoyancy.py"
      - "tests/servers/test_physics_softbody_hydrostatic_buoyancy.cpp"
      - ".github/workflows/physics-softbody-hydrostatic-buoyancy.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_softbody_hydrostatic_buoyancy.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/stress/test_physics_softbody_hydrostatic_buoyancy.py"
      - ".github/workflows/physics-softbody-hydrostatic-buoyancy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate soft-body hydrostatic numerical and source contracts
        run: python3 -m unittest discover -s tests/stress -p test_physics_softbody_hydrostatic_buoyancy.py -v
