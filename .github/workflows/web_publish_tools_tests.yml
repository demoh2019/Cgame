name: Web publishing helper tests

on:
  pull_request:
    paths:
      - 'platform/web/publish.py'
      - 'platform/web/tests/test_publish.py'
      - '.github/workflows/web_publish_tools_tests.yml'
  push:
    branches: [develop]
    paths:
      - 'platform/web/publish.py'
      - 'platform/web/tests/test_publish.py'
      - '.github/workflows/web_publish_tools_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run browser publishing tests
        run: python -m unittest discover -s platform/web/tests -p 'test_publish.py' -v
