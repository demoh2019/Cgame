name: Ogden hyperelastic FEM compiler and numerical contracts

on:
  push:
    branches: [develop]
    paths:
      - "servers/physics_fem_tetra_ogden.h"
      - "tests/servers/test_physics_fem_tetra_ogden.cpp"
      - "tests/stress/test_physics_fem_tetra_ogden_compiler.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - ".github/workflows/physics-fem-ogden.yml"
  pull_request:
    paths:
      - "servers/physics_fem_tetra_ogden.h"
      - "tests/servers/test_physics_fem_tetra_ogden.cpp"
      - "tests/stress/test_physics_fem_tetra_ogden_compiler.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - ".github/workflows/physics-fem-ogden.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ogden-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run native Ogden C++ smoke in float and double
        run: |
          for precision in float double; do
            flags=""
            if [ "$precision" = "double" ]; then flags="-DCGAME_USE_DOUBLE"; fi
            g++ -std=c++17 -O2 -Wall -Wextra -Werror $flags \
              -Itests/stress/physics_cpp_stubs -I. \
              tests/stress/test_physics_fem_tetra_ogden_compiler.cpp \
              -o "/tmp/physics_fem_ogden_$precision"
            "/tmp/physics_fem_ogden_$precision"
          done
