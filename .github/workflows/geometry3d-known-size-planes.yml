name: Geometry3D known-size plane buffers regression tests

on:
  pull_request:
    paths:
      - 'core/math/geometry_3d.cpp'
      - 'tests/core/math/test_geometry_3d.cpp'
      - '.github/workflows/geometry3d-known-size-planes.yml'
  push:
    branches: [develop]
    paths:
      - 'core/math/geometry_3d.cpp'
      - 'tests/core/math/test_geometry_3d.cpp'
      - '.github/workflows/geometry3d-known-size-planes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Compile native Geometry3D tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Verify all Geometry3D plane builders and ordering
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[Geometry3D]*"
