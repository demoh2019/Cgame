name: Content staged update regression tests

on:
  push:
    paths:
      - 'misc/scripts/content_staged_update.py'
      - 'misc/scripts/content_delta_bundle.py'
      - 'misc/scripts/content_manifest.py'
      - 'misc/scripts/tests/test_content_staged_update.py'
      - 'misc/scripts/README_content_staged_update.md'
      - '.github/workflows/content-staged-update.yml'
  pull_request:
    paths:
      - 'misc/scripts/content_staged_update.py'
      - 'misc/scripts/content_delta_bundle.py'
      - 'misc/scripts/content_manifest.py'
      - 'misc/scripts/tests/test_content_staged_update.py'
      - 'misc/scripts/README_content_staged_update.md'
      - '.github/workflows/content-staged-update.yml'

jobs:
  staged-content-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile and run staged update tests
        run: |
          python -m py_compile misc/scripts/content_manifest.py misc/scripts/content_delta_bundle.py misc/scripts/content_staged_update.py misc/scripts/tests/test_content_staged_update.py
          python -m unittest discover -s misc/scripts/tests -p test_content_staged_update.py -v
