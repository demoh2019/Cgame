name: Marshalls bounded bulk decoding and malformed count regressions

on:
  pull_request:
    paths:
      - 'core/io/marshalls.cpp'
      - 'tests/core/io/test_marshalls.cpp'
      - '.github/workflows/marshalls-bounded-bulk-decode.yml'
  push:
    branches: [develop]
    paths:
      - 'core/io/marshalls.cpp'
      - 'tests/core/io/test_marshalls.cpp'
      - '.github/workflows/marshalls-bounded-bulk-decode.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-marshalls:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Compile native network serialization tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Check large array and NodePath decode equivalence
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[Marshalls] Large NodePath and arrays use bounded bulk decoding*"
      - name: Reject malicious oversized count headers
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[Marshalls] Truncated enormous declared array counts are rejected before allocation*"
