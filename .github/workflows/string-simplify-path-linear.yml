name: Linear-path String simplification regression tests

on:
  push:
    branches: [develop]
    paths:
      - 'core/string/ustring.cpp'
      - 'tests/core/string/test_string.cpp'
      - 'misc/scripts/tests/test_string_simplify_path_linear.py'
      - '.github/workflows/string-simplify-path-linear.yml'
  pull_request:
    paths:
      - 'core/string/ustring.cpp'
      - 'tests/core/string/test_string.cpp'
      - 'misc/scripts/tests/test_string_simplify_path_linear.py'
      - '.github/workflows/string-simplify-path-linear.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s misc/scripts/tests -p test_string_simplify_path_linear.py -v

  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no -j2
      - run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[String] simplify_path linear*"
