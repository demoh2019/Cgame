name: Convex Collision Vertex Preallocation
on:
  pull_request:
    paths:
      - "scene/resources/mesh.cpp"
      - "tests/scene/test_arraymesh.cpp"
      - "misc/tests/test_convex_shape_fastpath.py"
      - ".github/workflows/convex-shape-preallocation.yml"
  workflow_dispatch:
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s misc/tests -p test_convex_shape_fastpath.py -v
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: linux-convex-shape-preallocation
        continue-on-error: true
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - uses: ./.github/actions/godot-cache-save
        with:
          cache-name: linux-convex-shape-preallocation
        continue-on-error: true
      - name: Native convex shape geometry regressions
        run: ./bin/godot.linuxbsd.editor.x86_64 --headless --test --test-case="*[ConvexShapeFastPath]*"
