name: AI Game Builder starter project tests

on:
  push:
    paths:
      - 'misc/scripts/ai_game_starters.py'
      - 'misc/scripts/tests/test_ai_game_starters.py'
      - 'misc/scripts/README_ai_game_starters.md'
      - '.github/workflows/ai-game-starters.yml'
  pull_request:
    paths:
      - 'misc/scripts/ai_game_starters.py'
      - 'misc/scripts/tests/test_ai_game_starters.py'
      - 'misc/scripts/README_ai_game_starters.md'
      - '.github/workflows/ai-game-starters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline generator unit and integration tests
        run: |
          python -m py_compile misc/scripts/ai_game_starters.py misc/scripts/tests/test_ai_game_starters.py
          python -m unittest discover -s misc/scripts/tests -p test_ai_game_starters.py -v

  godot-import-and-play-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and authenticate official Godot 4.7.2 Linux editor
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 -fL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Create, import and launch three games
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(mktemp -d)"
          trap 'rm -rf "$ROOT"' EXIT
          for template in platformer topdown fps3d; do
            python3 misc/scripts/ai_game_starters.py --template "$template" --output "$ROOT/$template"
            ./godot --headless --path "$ROOT/$template" --editor --import --quit 2>&1 | tee "$ROOT/${template}-import.log"
            ./godot --headless --path "$ROOT/$template" --quit-after 5 2>&1 | tee "$ROOT/${template}-run.log"
            if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource' "$ROOT/${template}-import.log" "$ROOT/${template}-run.log"; then
              exit 1
            fi
          done
