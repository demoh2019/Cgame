name: SoftBody3D link damping source contracts

on:
  pull_request:
    paths:
      - "servers/physics_softbody_link_damping.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_softbody_link_damping.cpp"
      - "tests/stress/test_physics_softbody_link_damping.py"
      - ".github/workflows/physics-softbody-link-damping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Link damping numerical reference and source wiring
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/stress -p 'test_physics_softbody_link_damping.py' -v
