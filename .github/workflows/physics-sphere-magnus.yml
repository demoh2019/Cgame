name: GodotPhysics3D sphere Magnus lift contracts

on:
  pull_request:
    paths:
      - "servers/physics_sphere_magnus_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "modules/godot_physics_3d/godot_body_3d.cpp"
      - "tests/servers/test_physics_sphere_magnus_3d.cpp"
      - "tests/stress/test_physics_sphere_magnus_3d.py"
      - ".github/workflows/physics-sphere-magnus.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_sphere_magnus_3d.h"
      - "modules/godot_physics_3d/godot_body_3d.cpp"
      - "tests/stress/test_physics_sphere_magnus_3d.py"
      - ".github/workflows/physics-sphere-magnus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sphere spin lift and GodotPhysics3D integration
        run: python3 -m unittest discover -s tests/stress -p test_physics_sphere_magnus_3d.py -v
