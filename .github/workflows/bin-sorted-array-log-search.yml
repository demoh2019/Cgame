name: BinSortedArray logarithmic boundary search regressions

on:
  push:
    branches: [develop]
    paths:
      - 'core/templates/bin_sorted_array.h'
      - 'tests/core/templates/test_bin_sorted_array.cpp'
      - '.github/workflows/bin-sorted-array-log-search.yml'
  pull_request:
    paths:
      - 'core/templates/bin_sorted_array.h'
      - 'tests/core/templates/test_bin_sorted_array.cpp'
      - '.github/workflows/bin-sorted-array-log-search.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-bin-sorted-array:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Build editor with native tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Run 64-bin grouping and removal regressions
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[BinSortedArray]*" --no-colors
