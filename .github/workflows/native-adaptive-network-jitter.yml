name: Native adaptive jitter buffering and Albion After rendering regressions

on:
  pull_request:
    paths:
      - 'scene/main/adaptive_network_jitter_buffer.*'
      - 'scene/register_scene_types.cpp'
      - 'tests/scene/test_adaptive_network_jitter_buffer.cpp'
      - 'game/scripts/client/network_jitter_buffer.gd'
      - 'game/scripts/client/entity_view.gd'
      - 'game/tests/test_network_jitter_buffer.gd'
      - '.github/workflows/native-adaptive-network-jitter.yml'
  push:
    branches: [develop]
    paths:
      - 'scene/main/adaptive_network_jitter_buffer.*'
      - 'scene/register_scene_types.cpp'
      - 'tests/scene/test_adaptive_network_jitter_buffer.cpp'
      - 'game/scripts/client/network_jitter_buffer.gd'
      - 'game/scripts/client/entity_view.gd'
      - 'game/tests/test_network_jitter_buffer.gd'
      - '.github/workflows/native-adaptive-network-jitter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-jitter:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin
      - uses: ./.github/actions/godot-deps
      - name: Build Cgame with doctest
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_text_server_fb_enabled=yes -j2
      - name: Native adaptive jitter tests
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          timeout 180s "$BIN" --headless --test --test-case="[AdaptiveNetworkJitterBuffer]*" --no-colors 2>&1 | tee native-jitter-tests.log
      - name: Import and test actual Albion After game
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee native-jitter-import.log
          timeout 360s "$BIN" --headless --path game --script res://tests/run_all.gd 2>&1 | tee native-jitter-game-tests.log
          grep -E '^TOTAL [0-9]+ checks, 0 failures$' native-jitter-game-tests.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' native-jitter-import.log native-jitter-game-tests.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-jitter-logs
          if-no-files-found: ignore
          path: |
            native-jitter-tests.log
            native-jitter-import.log
            native-jitter-game-tests.log
