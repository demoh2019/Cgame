name: PopupMenu touch activation sound regression

on:
  pull_request:
    branches: [develop]
    paths:
      - "scene/gui/popup_menu.cpp"
      - "scene/gui/popup_menu.h"
      - "misc/scripts/tests/test_popup_menu_touch_sounds.py"
      - ".github/workflows/popup-touch-sounds.yml"
  push:
    branches: [develop]
    paths:
      - "scene/gui/popup_menu.cpp"
      - "scene/gui/popup_menu.h"
      - "misc/scripts/tests/test_popup_menu_touch_sounds.py"
      - ".github/workflows/popup-touch-sounds.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m py_compile misc/scripts/tests/test_popup_menu_touch_sounds.py
          python3 -m unittest discover -s misc/scripts/tests -p test_popup_menu_touch_sounds.py -v

  linux-editor-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Launch headless editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/menu-smoke"
          printf '[application]\nconfig/name="PopupMenu touch regression"\n' > "$RUNNER_TEMP/menu-smoke/project.godot"
          timeout 120s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --editor --path "$RUNNER_TEMP/menu-smoke" --quit
