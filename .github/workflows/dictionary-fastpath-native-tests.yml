name: Untyped Dictionary Fast Path
on:
  pull_request:
    paths:
      - "core/variant/dictionary.cpp"
      - "tests/core/variant/test_dictionary.cpp"
      - ".github/workflows/dictionary-fastpath-native-tests.yml"
  workflow_dispatch:

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: linux-dictionary-fastpath-tests
        continue-on-error: true
      - uses: ./.github/actions/godot-deps
      - name: Compile editor with C++ tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - uses: ./.github/actions/godot-cache-save
        with:
          cache-name: linux-dictionary-fastpath-tests
        continue-on-error: true
      - name: Run dictionary fast-path regression tests
        run: ./bin/godot.linuxbsd.editor.x86_64 --headless --test --test-case="*[DictionaryFastPath]*"
