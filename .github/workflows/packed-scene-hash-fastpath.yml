name: Packed scene hash lookup and dictionary resource regressions

on:
  pull_request:
    paths:
      - 'scene/resources/packed_scene.cpp'
      - 'scene/resources/packed_scene.h'
      - 'tests/scene/test_packed_scene.cpp'
      - '.github/workflows/packed-scene-hash-fastpath.yml'
  push:
    branches: [develop]
    paths:
      - 'scene/resources/packed_scene.cpp'
      - 'scene/resources/packed_scene.h'
      - 'tests/scene/test_packed_scene.cpp'
      - '.github/workflows/packed-scene-hash-fastpath.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-scene-fastpaths:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - name: Compile editor with native scene tests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no module_text_server_fb_enabled=yes accesskit=no -j2
      - name: Verify bulk pack and instantiate
        run: ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[PackedScene] Bulk scene pack and instantiate preserves names, groups, and dictionaries*"
