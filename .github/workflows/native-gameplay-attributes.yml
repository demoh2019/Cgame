name: Native Gameplay Attributes and Albion status response

on:
  pull_request:
    branches: [develop]
    paths:
      - 'modules/gameplay_fx/gameplay_attribute_set.*'
      - 'modules/gameplay_fx/register_types.cpp'
      - 'modules/gameplay_fx/config.py'
      - 'modules/gameplay_fx/tests/test_gameplay_fx.h'
      - 'modules/gameplay_fx/doc_classes/GameplayAttributeSet.xml'
      - 'game/scripts/client/engine_features.gd'
      - 'game/scripts/client/entity_view.gd'
      - 'game/tests/test_gameplay_attributes.gd'
      - 'game/tests/run_gameplay_attributes.gd'
      - '.github/workflows/native-gameplay-attributes.yml'
  push:
    branches: [develop]
    paths:
      - 'modules/gameplay_fx/gameplay_attribute_set.*'
      - 'modules/gameplay_fx/register_types.cpp'
      - 'modules/gameplay_fx/config.py'
      - 'modules/gameplay_fx/tests/test_gameplay_fx.h'
      - 'modules/gameplay_fx/doc_classes/GameplayAttributeSet.xml'
      - 'game/scripts/client/engine_features.gd'
      - 'game/scripts/client/entity_view.gd'
      - 'game/tests/test_gameplay_attributes.gd'
      - 'game/tests/run_gameplay_attributes.gd'
      - '.github/workflows/native-gameplay-attributes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-attributes:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - name: Run native Gameplay Attributes doctests
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --test --test-case="*GameplayAttributeSet*" 2>&1 | tee attributes-native.log
      - name: Import Albion After
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee attributes-import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' attributes-import.log; then exit 1; fi
      - name: Verify Albion native and stock fallback integration
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 180s "$BIN" --headless --path game --script res://tests/run_gameplay_attributes.gd 2>&1 | tee attributes-game.log
          grep -E '^GAMEPLAY ATTRIBUTES TOTAL: [0-9]+ checks, 0 failures$' attributes-game.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' attributes-game.log; then exit 1; fi
      - name: Archive logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-attributes-ci
          if-no-files-found: ignore
          path: |
            attributes-native.log
            attributes-import.log
            attributes-game.log
