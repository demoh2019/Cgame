name: Multiplayer UDP simulator tests

on:
  push:
    paths:
      - 'misc/scripts/multiplayer_network_sim.py'
      - 'misc/scripts/network_sim_presets.py'
      - 'misc/scripts/tests/test_network_sim_presets.py'
      - 'misc/scripts/tests/test_multiplayer_network_sim.py'
      - 'misc/scripts/MULTIPLAYER_NETWORK_SIM.md'
      - '.github/workflows/multiplayer-network-sim-tests.yml'
  pull_request:
    paths:
      - 'misc/scripts/multiplayer_network_sim.py'
      - 'misc/scripts/network_sim_presets.py'
      - 'misc/scripts/tests/test_network_sim_presets.py'
      - 'misc/scripts/tests/test_multiplayer_network_sim.py'
      - 'misc/scripts/MULTIPLAYER_NETWORK_SIM.md'
      - '.github/workflows/multiplayer-network-sim-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-udp-tests:
    name: UDP proxy regression tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python3 -m py_compile misc/scripts/multiplayer_network_sim.py misc/scripts/network_sim_presets.py misc/scripts/tests/test_multiplayer_network_sim.py misc/scripts/tests/test_network_sim_presets.py
      - name: Run UDP integration tests
        run: python3 -m unittest discover -s misc/scripts/tests -p 'test_multiplayer_network_sim.py' -v
          python3 -m unittest discover -s misc/scripts/tests -p 'test_network_sim_presets.py' -v
