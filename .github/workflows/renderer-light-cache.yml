name: Rendering scene light buffer reuse regression

on:
  push:
    branches: [develop]
    paths:
      - 'servers/rendering/renderer_scene_cull.cpp'
      - 'servers/rendering/renderer_scene_cull.h'
      - 'misc/scripts/tests/test_renderer_light_cache.py'
      - '.github/workflows/renderer-light-cache.yml'
  pull_request:
    branches: [develop]
    paths:
      - 'servers/rendering/renderer_scene_cull.cpp'
      - 'servers/rendering/renderer_scene_cull.h'
      - 'misc/scripts/tests/test_renderer_light_cache.py'
      - '.github/workflows/renderer-light-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check frame reuse invariants
        run: |
          python -m py_compile misc/scripts/tests/test_renderer_light_cache.py
          python -m unittest discover -s misc/scripts/tests -p test_renderer_light_cache.py -v
