name: UDP ring-buffer batched framing regression

on:
  pull_request:
    branches: [develop]
    paths:
      - 'core/io/packet_peer_udp.cpp'
      - 'tests/core/io/test_udp_server.cpp'
      - '.github/workflows/udp-batched-ring-header.yml'
  push:
    branches: [develop]
    paths:
      - 'core/io/packet_peer_udp.cpp'
      - 'tests/core/io/test_udp_server.cpp'
      - '.github/workflows/udp-batched-ring-header.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-udp-ring:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no
      - name: Run UDP queue framing, ring wrap, and networking regression
        run: |
          timeout 300s ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case='*[UDPServer]*' --no-colors
