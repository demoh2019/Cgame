name: SoftBody3D pair friction numerical contracts

on:
  pull_request:
    paths:
      - "servers/physics_softbody_pair_contact.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "modules/godot_physics_3d/godot_step_3d.cpp"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_softbody_pair_friction.cpp"
      - "tests/stress/test_physics_softbody_pair_friction.py"
      - ".github/workflows/physics-softbody-pair-friction.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_softbody_pair_contact.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/stress/test_physics_softbody_pair_friction.py"
      - ".github/workflows/physics-softbody-pair-friction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Coulomb budget, conservation and source wiring
        run: python3 -m unittest discover -s tests/stress -p test_physics_softbody_pair_friction.py -v
