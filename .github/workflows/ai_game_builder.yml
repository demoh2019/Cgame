name: AI Game Builder addon tests

on:
  pull_request:
    paths:
      - 'misc/ai_game_builder/**'
      - '.github/workflows/ai_game_builder.yml'
  push:
    paths:
      - 'misc/ai_game_builder/**'
      - '.github/workflows/ai_game_builder.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            misc/ai_game_builder
          sparse-checkout-cone-mode: true
      - name: Install Godot 4.8 beta 4
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.8-beta4/Godot_v4.8-beta4_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/
          chmod +x /tmp/Godot_v4.8-beta4_linux.x86_64
          /tmp/Godot_v4.8-beta4_linux.x86_64 --version
      - name: Run validator and context tests
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/Godot_v4.8-beta4_linux.x86_64
          $GODOT --headless --path misc/ai_game_builder --script res://tests/test_validator.gd
          $GODOT --headless --path misc/ai_game_builder --script res://tests/test_context.gd
          $GODOT --headless --path misc/ai_game_builder --script res://tests/test_quality.gd
          $GODOT --headless --path misc/ai_game_builder --script res://tests/test_starter.gd
          $GODOT --headless --path misc/ai_game_builder --script res://tests/test_starter_3d.gd
      - name: Import addon and inspect editor startup errors
        shell: bash
        run: |
          set -euo pipefail
          /tmp/Godot_v4.8-beta4_linux.x86_64 --headless --editor \
            --path misc/ai_game_builder --quit 2>&1 | tee /tmp/godot-editor.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' /tmp/godot-editor.log; then
            exit 1
          fi

      - name: Smoke test bundled playable scene in a fresh headless project
        shell: bash
        run: |
          set -euo pipefail
          GODOT=/tmp/Godot_v4.8-beta4_linux.x86_64
          STAGING="$(mktemp -d)"
          mkdir -p "$STAGING/ai_generated/scenes" "$STAGING/ai_generated/scripts"
          printf '%s\n' 'config_version=5' '[application]' 'config/name="AI Starter Smoke Test"' > "$STAGING/project.godot"
          cp misc/ai_game_builder/addons/ai_game_builder/templates/arcade_2d/scenes/main.tscn "$STAGING/ai_generated/scenes/main.tscn"
          cp misc/ai_game_builder/addons/ai_game_builder/templates/arcade_2d/scripts/arcade.gd "$STAGING/ai_generated/scripts/arcade.gd"
          $GODOT --headless --editor --path "$STAGING" --quit 2>&1 | tee /tmp/ai-starter-import.log
          $GODOT --headless --path "$STAGING" --quit-after 5 res://ai_generated/scenes/main.tscn 2>&1 | tee /tmp/ai-starter-run.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource' /tmp/ai-starter-{import,run}.log; then
            exit 1
          fi

          # A separate, clean project verifies the 3D starter's actual scene,
          # script parse, object creation, win condition and timeout behavior.
          STAGING_3D="$(mktemp -d)"
          mkdir -p "$STAGING_3D/ai_generated/scenes" "$STAGING_3D/ai_generated/scripts" "$STAGING_3D/tests"
          printf '%s\n' 'config_version=5' '[application]' 'config/name="AI 3D Starter Smoke Test"' '[rendering]' 'renderer/rendering_method="gl_compatibility"' > "$STAGING_3D/project.godot"
          cp misc/ai_game_builder/addons/ai_game_builder/templates/arena_3d/scenes/main.tscn "$STAGING_3D/ai_generated/scenes/main.tscn"
          cp misc/ai_game_builder/addons/ai_game_builder/templates/arena_3d/scripts/arena_3d.gd "$STAGING_3D/ai_generated/scripts/arena_3d.gd"
          cp misc/ai_game_builder/tests/test_runtime_3d.gd "$STAGING_3D/tests/test_runtime_3d.gd"
          $GODOT --headless --editor --path "$STAGING_3D" --quit 2>&1 | tee /tmp/ai-3d-starter-import.log
          $GODOT --headless --path "$STAGING_3D" --script res://tests/test_runtime_3d.gd 2>&1 | tee /tmp/ai-3d-starter-logic.log
          $GODOT --headless --path "$STAGING_3D" --quit-after 8 res://ai_generated/scenes/main.tscn 2>&1 | tee /tmp/ai-3d-starter-run.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource' /tmp/ai-3d-starter-{import,logic,run}.log; then
            exit 1
          fi
