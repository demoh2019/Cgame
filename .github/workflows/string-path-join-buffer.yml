name: String path join single-buffer regressions

on:
  pull_request:
    branches: [develop]
    paths:
      - "core/string/ustring.cpp"
      - "tests/core/string/test_string.cpp"
      - ".github/workflows/string-path-join-buffer.yml"
  push:
    branches: [develop]
    paths:
      - "core/string/ustring.cpp"
      - "tests/core/string/test_string.cpp"
      - ".github/workflows/string-path-join-buffer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-path-joins:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes tests=yes debug_symbols=no module_mono_enabled=no accesskit=no -j2
      - name: Run path joining and path extraction checks
        run: |
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[String] Path joining*" --no-colors
          ./bin/godot.linuxbsd.editor.dev.x86_64 --headless --test --test-case="*[String] Path extraction*" --no-colors
