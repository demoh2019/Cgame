name: GodotPhysics3D closed softbody bulk viscosity

on:
  push:
    branches: [develop]
    paths:
      - "servers/physics_softbody_volume_damping.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_softbody_volume_damping.cpp"
      - "tests/stress/test_physics_softbody_volume_damping.py"
      - ".github/workflows/physics-softbody-volume-damping.yml"
  pull_request:
    paths:
      - "servers/physics_softbody_volume_damping.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_softbody_volume_damping.cpp"
      - "tests/stress/test_physics_softbody_volume_damping.py"
      - ".github/workflows/physics-softbody-volume-damping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Volume-rate damping, momentum conservation and source wiring
        run: python3 -m unittest discover -s tests/stress -p 'test_physics_softbody_volume_damping.py' -v
