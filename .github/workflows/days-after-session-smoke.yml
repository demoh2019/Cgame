name: Days After world session persistence

on:
  pull_request:
    paths:
      - 'demo/days_after/**'
      - '.github/workflows/days-after-session-smoke.yml'
  push:
    branches: [develop]
    paths:
      - 'demo/days_after/**'
      - '.github/workflows/days-after-session-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Godot compatibility editor
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 -fL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Import and parse scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./godot --headless --path demo/days_after --editor --import --quit 2>&1 | tee import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource' import.log; then exit 1; fi
      - name: Run standalone survivor and combined world session regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./godot --headless --path demo/days_after --script res://smoke_test_saves.gd 2>&1 | tee player-save.log
          grep -F 'PASS: survivor save/load' player-save.log
          timeout 120s ./godot --headless --path demo/days_after --script res://smoke_test_session.gd 2>&1 | tee session-save.log
          grep -F 'PASS: Days After session save/load' session-save.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Assertion failed|Invalid call' player-save.log session-save.log; then exit 1; fi
      - name: Upload failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: days-after-session-smoke-logs
          if-no-files-found: ignore
          path: |
            import.log
            player-save.log
            session-save.log
