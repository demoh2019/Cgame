name: Image RGBA8 masked blit performance regressions

on:
  push:
    branches: [develop]
    paths:
      - 'core/io/image.cpp'
      - 'tests/core/io/test_image.cpp'
      - 'misc/scripts/tests/bench_image_mask_runs.cpp'
      - 'misc/scripts/tests/test_image_mask_hotpath.py'
      - '.github/workflows/image-mask-hotpath.yml'
  pull_request:
    paths:
      - 'core/io/image.cpp'
      - 'tests/core/io/test_image.cpp'
      - 'misc/scripts/tests/bench_image_mask_runs.cpp'
      - 'misc/scripts/tests/test_image_mask_hotpath.py'
      - '.github/workflows/image-mask-hotpath.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differential-and-benchmark:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: ['g++', 'clang++']
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Cgame native source invariants
        run: python -m unittest discover -s misc/scripts/tests -p test_image_mask_hotpath.py -v
      - name: Compile standalone differential and speed benchmark
        shell: bash
        run: |
          set -euo pipefail
          "${{ matrix.compiler }}" -std=c++17 -O3 -Wall -Wextra -Werror -pedantic \
            misc/scripts/tests/bench_image_mask_runs.cpp -o /tmp/bench_image_mask_runs
      - name: Check 15000 byte-exact cases and report synthetic speed
        run: /tmp/bench_image_mask_runs

  native-image-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Linux editor native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin
      - uses: ./.github/actions/godot-deps
      - name: Build Cgame with native doctests
        uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: dev_build=yes debug_symbols=no tests=yes module_text_server_fb_enabled=yes -j2
      - name: Native masked Image blit regressions
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.dev.x86_64
          "$BIN" --headless --test --test-case='*[Image][MaskedBlit]*' --no-colors
