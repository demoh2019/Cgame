name: SoftBody3D dihedral angular damping contracts

on:
  push:
    branches: [develop]
    paths:
      - "servers/physics_softbody_dihedral_damping.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_softbody_dihedral_damping.cpp"
      - "tests/stress/test_physics_softbody_dihedral_damping.py"
      - ".github/workflows/physics-softbody-dihedral-damping.yml"
  pull_request:
    paths:
      - "servers/physics_softbody_dihedral_damping.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_softbody_dihedral_damping.cpp"
      - "tests/stress/test_physics_softbody_dihedral_damping.py"
      - ".github/workflows/physics-softbody-dihedral-damping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Damping conservation, dissipation, finite differences, source wiring
        run: python3 -m unittest discover -s tests/stress -p 'test_physics_softbody_dihedral_damping.py' -v
