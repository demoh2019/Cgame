name: Jolt soft-body long-range attachments and pinned cloth

on:
  pull_request:
    paths:
      - "modules/jolt_physics/objects/jolt_soft_body_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "thirdparty/jolt_physics/Jolt/Physics/SoftBody/SoftBodySharedSettings.h"
      - "tests/stress/test_jolt_softbody_lra.py"
      - "tests/stress/jolt_lra/**"
      - ".github/workflows/jolt-softbody-lra.yml"
  push:
    paths:
      - "modules/jolt_physics/objects/jolt_soft_body_3d.cpp"
      - "modules/jolt_physics/jolt_project_settings.cpp"
      - "modules/jolt_physics/jolt_project_settings.h"
      - "tests/stress/test_jolt_softbody_lra.py"
      - "tests/stress/jolt_lra/**"
      - ".github/workflows/jolt-softbody-lra.yml"
  workflow_dispatch:

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test LRA topology and welded vertex pin contracts
        run: python3 -m unittest tests/stress/test_jolt_softbody_lra.py -v
      - name: Compile test source to bytecode
        run: python3 -m py_compile tests/stress/test_jolt_softbody_lra.py
      - name: Verify headless Jolt fixture
        run: test -f tests/stress/jolt_lra/project.godot && test -f tests/stress/jolt_lra/pinned_cloth_lra_regression.gd
