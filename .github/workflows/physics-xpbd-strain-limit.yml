name: XPBD SoftBody strain-limit contracts

on:
  pull_request:
    paths:
      - "servers/physics_xpbd_strain_limit.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_xpbd_strain_limit.cpp"
      - "tests/stress/test_physics_xpbd_strain_limit.py"
      - ".github/workflows/physics-xpbd-strain-limit.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_xpbd_strain_limit.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/servers/test_physics_xpbd_strain_limit.cpp"
      - "tests/stress/test_physics_xpbd_strain_limit.py"
      - ".github/workflows/physics-xpbd-strain-limit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strain-limit-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate unilateral XPBD math and engine source integration
        run: python3 -m unittest discover -s tests/stress -p 'test_physics_xpbd_strain_limit.py' -v
