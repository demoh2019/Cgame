name: Upstream Basis, X11 and Vulkan regression tests

on:
  push:
    branches: [develop]
    paths:
      - "editor/import/resource_importer_texture.cpp"
      - "scene/resources/compressed_texture.cpp"
      - "scene/resources/compressed_texture.h"
      - "scene/resources/portable_compressed_texture.cpp"
      - "platform/linuxbsd/x11/display_server_x11.cpp"
      - "drivers/vulkan/rendering_context_driver_vulkan.cpp"
      - "drivers/vulkan/rendering_device_driver_vulkan.cpp"
      - "misc/scripts/tests/test_upstream_basis_x11_vulkan.py"
      - ".github/workflows/upstream-basis-x11-vulkan.yml"
  pull_request:
    paths:
      - "editor/import/resource_importer_texture.cpp"
      - "scene/resources/compressed_texture.cpp"
      - "scene/resources/compressed_texture.h"
      - "scene/resources/portable_compressed_texture.cpp"
      - "platform/linuxbsd/x11/display_server_x11.cpp"
      - "drivers/vulkan/rendering_context_driver_vulkan.cpp"
      - "drivers/vulkan/rendering_device_driver_vulkan.cpp"
      - "misc/scripts/tests/test_upstream_basis_x11_vulkan.py"
      - ".github/workflows/upstream-basis-x11-vulkan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backport-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile misc/scripts/tests/test_upstream_basis_x11_vulkan.py
      - name: Run source and compiled C++ regression tests
        env:
          CXX: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s misc/scripts/tests -p 'test_upstream_basis_x11_vulkan.py' -v
