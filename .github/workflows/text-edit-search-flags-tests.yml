name: Upstream TextEdit Search Flag Regressions

on:
  pull_request:
    paths:
      - "scene/gui/text_edit.cpp"
      - "tests/scene/test_text_edit_search_flags.cpp"
      - ".github/workflows/text-edit-search-flags-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-text-edit-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Godot build dependencies
        uses: ./.github/actions/godot-deps

      - name: Build Godot with native C++ tests
        run: scons platform=linuxbsd target=editor tests=yes module_text_server_fb_enabled=yes -j2

      - name: Run next-occurrence selection regressions
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find bin -maxdepth 1 -type f -name 'godot.linuxbsd.editor.*' -perm /u+x | head -n 1)"
          test -n "$exe"
          "$exe" --headless --test --test-case="*[TextEditSearchFlags]*"
