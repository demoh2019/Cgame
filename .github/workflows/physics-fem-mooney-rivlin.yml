name: Mooney Rivlin tetrahedral FEM compiler and material contracts

on:
  push:
    branches: [develop]
    paths:
      - "servers/physics_fem_tetra_mooney_rivlin.h"
      - "tests/servers/test_physics_fem_tetra_mooney_rivlin.cpp"
      - "tests/stress/test_physics_fem_tetra_mooney_rivlin_compiler.cpp"
      - "tests/stress/physics_cpp_stubs/core/math/vector3.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - ".github/workflows/physics-fem-mooney-rivlin.yml"
  pull_request:
    paths:
      - "servers/physics_fem_tetra_mooney_rivlin.h"
      - "tests/servers/test_physics_fem_tetra_mooney_rivlin.cpp"
      - "tests/stress/test_physics_fem_tetra_mooney_rivlin_compiler.cpp"
      - "tests/stress/physics_cpp_stubs/core/math/vector3.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "servers/physics_3d/physics_server_3d.cpp"
      - ".github/workflows/physics-fem-mooney-rivlin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mooney-rivlin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run Mooney-Rivlin FEM under float32 and float64
        run: |
          for precision in float double; do
            flags=""
            if [ "$precision" = "double" ]; then flags="-DCGAME_USE_DOUBLE"; fi
            g++ -std=c++17 -O2 -Wall -Wextra -Werror $flags \
              -Itests/stress/physics_cpp_stubs -I. \
              tests/stress/test_physics_fem_tetra_mooney_rivlin_compiler.cpp \
              -o "/tmp/physics_fem_mooney_$precision"
            "/tmp/physics_fem_mooney_$precision"
          done
