name: SoftBody3D swept pair CCD regression contracts

on:
  pull_request:
    paths:
      - "servers/physics_softbody_pair_ccd.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "modules/godot_physics_3d/godot_soft_body_3d.h"
      - "modules/godot_physics_3d/godot_space_3d.cpp"
      - "modules/godot_physics_3d/godot_space_3d.h"
      - "modules/godot_physics_3d/godot_step_3d.cpp"
      - "servers/physics_3d/physics_server_3d.cpp"
      - "tests/servers/test_physics_softbody_pair_ccd.cpp"
      - "tests/stress/test_physics_softbody_pair_ccd.py"
      - ".github/workflows/physics-softbody-pair-ccd.yml"
  push:
    branches: [develop]
    paths:
      - "servers/physics_softbody_pair_ccd.h"
      - "modules/godot_physics_3d/godot_soft_body_3d.cpp"
      - "tests/stress/test_physics_softbody_pair_ccd.py"
      - ".github/workflows/physics-softbody-pair-ccd.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify swept pair TOI, mass-weighted correction and code wiring
        run: python3 -m unittest discover -s tests/stress -p test_physics_softbody_pair_ccd.py -v
