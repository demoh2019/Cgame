name: Web preview server tests

on:
  pull_request:
    paths:
      - "platform/web/serve.py"
      - "platform/web/tests/test_serve.py"
      - ".github/workflows/web-preview-server-tests.yml"
  push:
    branches:
      - develop
    paths:
      - "platform/web/serve.py"
      - "platform/web/tests/test_serve.py"
      - ".github/workflows/web-preview-server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run web preview regression tests
        run: python -m unittest discover -s platform/web/tests -p test_serve.py -v
