name: Upstream mirror Python tests

on:
  pull_request:
    paths:
      - 'misc/scripts/mirror_godot_tracker.py'
      - 'misc/scripts/test_mirror_godot_tracker.py'
      - 'misc/scripts/GODOT_UPSTREAM_MIRROR.md'
      - '.github/workflows/upstream_mirror_tests.yml'
  push:
    paths:
      - 'misc/scripts/mirror_godot_tracker.py'
      - 'misc/scripts/test_mirror_godot_tracker.py'
      - '.github/workflows/upstream_mirror_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python3 -m compileall -q misc/scripts/mirror_godot_tracker.py misc/scripts/test_mirror_godot_tracker.py
      - name: Test migration behavior
        run: python3 -m unittest discover -s misc/scripts -p 'test_mirror_godot_tracker.py' -v
