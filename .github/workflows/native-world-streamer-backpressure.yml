name: Adaptive native WorldStreamer backpressure

on:
  pull_request:
    branches: [develop]
    paths:
      - 'scene/main/world_streamer.cpp'
      - 'scene/main/world_streamer.h'
      - 'doc/classes/WorldStreamer.xml'
      - 'game/scripts/client/online_main.gd'
      - 'game/tests/test_world_streamer_backpressure.gd'
      - 'game/tests/run_all.gd'
      - 'tests/scene/test_world_streamer_backpressure.cpp'
      - 'tests/scene/test_world_streamer_simulation_tiers.cpp'
      - 'game/tests/test_world_streamer_simulation_tiers.gd'
      - 'game/tests/run_simulation_tiers.gd'
      - 'game/scripts/client/world_map.gd'
      - 'game/tests/test_auxiliary_streaming_readiness.gd'
      - 'game/tests/run_auxiliary_readiness.gd'
      - 'tests/scene/test_world_streamer_auxiliary_readiness.cpp'
      - 'game/scripts/client/chunk_view.gd'
      - 'game/tests/test_world_streamer_chunk_cache.gd'
      - 'game/tests/run_chunk_cache.gd'
      - 'tests/scene/test_world_streamer_chunk_cache.cpp'
      - 'game/scripts/client/graphics_quality.gd'
      - 'game/tests/test_world_streamer_unload_budget.gd'
      - 'game/tests/run_streamer_unloads.gd'
      - 'tests/scene/test_world_streamer_unload_budget.cpp'
      - 'tests/scene/test_world_streamer_backpressure_contract.py'
      - '.github/workflows/native-world-streamer-backpressure.yml'
  push:
    branches: [develop]
    paths:
      - 'scene/main/world_streamer.cpp'
      - 'scene/main/world_streamer.h'
      - 'doc/classes/WorldStreamer.xml'
      - 'game/scripts/client/online_main.gd'
      - 'game/tests/test_world_streamer_backpressure.gd'
      - 'tests/scene/test_world_streamer_backpressure.cpp'
      - 'tests/scene/test_world_streamer_simulation_tiers.cpp'
      - 'game/tests/test_world_streamer_simulation_tiers.gd'
      - 'game/tests/run_simulation_tiers.gd'
      - 'game/scripts/client/world_map.gd'
      - 'game/tests/test_auxiliary_streaming_readiness.gd'
      - 'game/tests/run_auxiliary_readiness.gd'
      - 'tests/scene/test_world_streamer_auxiliary_readiness.cpp'
      - 'game/scripts/client/chunk_view.gd'
      - 'game/tests/test_world_streamer_chunk_cache.gd'
      - 'game/tests/run_chunk_cache.gd'
      - 'tests/scene/test_world_streamer_chunk_cache.cpp'
      - 'game/scripts/client/graphics_quality.gd'
      - 'game/tests/test_world_streamer_unload_budget.gd'
      - 'game/tests/run_streamer_unloads.gd'
      - 'tests/scene/test_world_streamer_unload_budget.cpp'
      - 'tests/scene/test_world_streamer_backpressure_contract.py'
      - '.github/workflows/native-world-streamer-backpressure.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scene/main/world_streamer.cpp
            scene/main/world_streamer.h
            doc/classes/WorldStreamer.xml
            game/scripts/client/online_main.gd
            game/tests/test_world_streamer_backpressure.gd
            game/tests/run_all.gd
            tests/scene/test_world_streamer_backpressure.cpp
            tests/scene/test_world_streamer_backpressure_contract.py
          sparse-checkout-cone-mode: false
      - name: Validate adaptive stream budgets, numeric model and integration
        run: python3 -m unittest tests/scene/test_world_streamer_backpressure_contract.py -v

  native-and-game:
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - name: Native streamer pressure tests
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 240s "$BIN" --headless --test --test-case="*[WorldStreamer]*" 2>&1 | tee streamer-native.log
          if grep -Ei 'FAILED|failed assertions|test cases:.*failed' streamer-native.log; then exit 1; fi
      - name: Import Albion After
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee streamer-import.log
      - name: Game streaming regression tests
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 300s "$BIN" --headless --path game --script res://tests/run_streamer_backpressure.gd 2>&1 | tee streamer-game.log
          grep -E '^STREAM BACKPRESSURE TOTAL: [0-9]+ checks, 0 failures$' streamer-game.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' streamer-game.log; then exit 1; fi
      - name: Game native simulation-tier regression
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 300s "$BIN" --headless --path game --script res://tests/run_simulation_tiers.gd 2>&1 | tee simulation-tier.log
          grep -E '^SIMULATION TIERS TOTAL: [0-9]+ checks, 0 failures$' simulation-tier.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' simulation-tier.log; then exit 1; fi
      - name: Auxiliary source readiness and expedition map
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 300s "$BIN" --headless --path game --script res://tests/run_auxiliary_readiness.gd 2>&1 | tee auxiliary-readiness.log
          grep -E '^AUXILIARY READINESS TOTAL: [0-9]+ checks, 0 failures$' auxiliary-readiness.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' auxiliary-readiness.log; then exit 1; fi
      - name: Cached procedural chunk and Albion scene reuse regression
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 300s "$BIN" --headless --path game --script res://tests/run_chunk_cache.gd 2>&1 | tee chunk-cache.log
          grep -E '^CHUNK CACHE TOTAL: [0-9]+ checks, 0 failures$' chunk-cache.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' chunk-cache.log; then exit 1; fi
      - name: Budgeted visual chunk unloads and quality presets
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 300s "$BIN" --headless --path game --script res://tests/run_streamer_unloads.gd 2>&1 | tee streamer-unloads.log
          grep -E '^STREAM UNLOADS TOTAL: [0-9]+ checks, 0 failures        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-streamer-regression
          if-no-files-found: ignore
          path: |
            streamer-native.log
            streamer-import.log
            streamer-game.log
            simulation-tier.log
            auxiliary-readiness.log
            chunk-cache.log
 streamer-unloads.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' streamer-unloads.log; then exit 1; fi
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-streamer-regression
          if-no-files-found: ignore
          path: |
            streamer-native.log
            streamer-import.log
            streamer-game.log
            simulation-tier.log
            auxiliary-readiness.log
            streamer-unloads.log
            chunk-cache.log
