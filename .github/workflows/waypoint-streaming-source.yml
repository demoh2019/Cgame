name: WorldStreamer auxiliary source and game map waypoint

on:
  pull_request:
    branches: [develop]
    paths:
      - 'scene/main/world_streamer.cpp'
      - 'scene/main/world_streamer.h'
      - 'doc/classes/WorldStreamer.xml'
      - 'game/scripts/client/world_streaming_policy.gd'
      - 'game/scripts/client/online_main.gd'
      - 'game/tests/test_waypoint_streaming_source.gd'
      - '.github/workflows/waypoint-streaming-source.yml'
  push:
    branches: [develop]
    paths:
      - 'scene/main/world_streamer.cpp'
      - 'scene/main/world_streamer.h'
      - 'doc/classes/WorldStreamer.xml'
      - 'game/scripts/client/world_streaming_policy.gd'
      - 'game/scripts/client/online_main.gd'
      - 'game/tests/test_waypoint_streaming_source.gd'
      - '.github/workflows/waypoint-streaming-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-world-streaming:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: linux-world-streamer-auxiliary
        continue-on-error: true
      - uses: ./.github/actions/godot-deps
      - uses: ./.github/actions/godot-build
        with:
          platform: linuxbsd
          target: editor
          scons-flags: tests=yes module_text_server_fb_enabled=yes -j2
      - uses: ./.github/actions/godot-cache-save
        with:
          cache-name: linux-world-streamer-auxiliary
        continue-on-error: true
      - name: Headless native streaming and graphics tests
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/godot.linuxbsd.editor.x86_64
          timeout 360s "$BIN" --headless --path game --editor --import --quit 2>&1 | tee waypoint-import.log
          timeout 360s "$BIN" --headless --path game --script res://tests/run_graphics.gd 2>&1 | tee waypoint-tests.log
          grep -E '^GRAPHICS TOTAL: [0-9]+ checks, 0 failures$' waypoint-tests.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script|^FAIL ' waypoint-tests.log; then exit 1; fi
      - name: Archive streaming regression logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auxiliary-world-streaming-logs
          if-no-files-found: ignore
          path: |
            waypoint-import.log
            waypoint-tests.log
