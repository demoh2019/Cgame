name: Days After survival and professions smoke

on:
  pull_request:
    paths:
      - 'demo/days_after/**'
      - '.github/workflows/days-after-gameplay.yml'
  push:
    branches: [develop]
    paths:
      - 'demo/days_after/**'
      - '.github/workflows/days-after-gameplay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download verified Godot 4.7.2 compatibility editor
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 3 -fL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum --check --status
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Import project and parse GDScript
        run: |
          set -euo pipefail
          ./godot --headless --path demo/days_after --editor --import --quit 2>&1 | tee days-after-import.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Failed to load script' days-after-import.log; then exit 1; fi
      - name: Run gameplay smoke with real physics steps
        run: |
          set -euo pipefail
          timeout 120s ./godot --headless --path demo/days_after --script res://smoke_test.gd 2>&1 | tee days-after-smoke.log
          grep -F 'PASS: Days After scene, survival, gathering, crafting, tier gates, respawn and 10 physics frames.' days-after-smoke.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Assertion failed' days-after-smoke.log; then exit 1; fi
      - name: Run inventory and invalid-pickup regression
        run: |
          set -euo pipefail
          timeout 120s ./godot --headless --path demo/days_after --script res://smoke_test_inventory.gd 2>&1 | tee days-after-inventory.log
          grep -F 'PASS: Days After player, food, water, one-shot pickup, and inventory bounds.' days-after-inventory.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Assertion failed' days-after-inventory.log; then exit 1; fi
      - name: Test cover-aware melee combat
        run: |
          set -euo pipefail
          timeout 120s ./godot --headless --path demo/days_after --script res://smoke_test_combat_visibility.gd 2>&1 | tee days-after-visibility.log
          grep -F 'PASS: Days After combat line-of-sight blocks walls and permits clear melee.' days-after-visibility.log
          if grep -Ei 'SCRIPT ERROR:|Parse Error:|Assertion failed' days-after-visibility.log; then exit 1; fi
      - name: Upload smoke test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: days-after-gameplay-logs
          if-no-files-found: ignore
          path: |
            days-after-import.log
            days-after-smoke.log
            days-after-inventory.log
            days-after-visibility.log
