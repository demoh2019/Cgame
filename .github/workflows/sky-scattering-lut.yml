name: Sky scattering native LUT
on:
  push:
    branches: [develop]
    paths:
      - "modules/sky_scattering_lut/**"
      - "game/assets/shaders/sky.gdshader"
      - "game/scripts/client/atmosphere.gd"
      - "game/scripts/client/graphics_profiles.gd"
      - "game/scripts/client/graphics_quality.gd"
      - ".github/workflows/sky-scattering-lut.yml"
  pull_request:
    branches: [develop]
    paths:
      - "modules/sky_scattering_lut/**"
      - "game/assets/shaders/sky.gdshader"
      - "game/scripts/client/atmosphere.gd"
      - "game/scripts/client/graphics_profiles.gd"
      - "game/scripts/client/graphics_quality.gd"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Validate bounded spectral LUT model
        shell: bash
        run: |
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            modules/sky_scattering_lut/tests/test_scattering_policy.cpp \
            -o /tmp/test_sky_scattering_lut
          /tmp/test_sky_scattering_lut
      - name: Confirm game shader integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          shader = Path("game/assets/shaders/sky.gdshader").read_text()
          atmosphere = Path("game/scripts/client/atmosphere.gd").read_text()
          quality = Path("game/scripts/client/graphics_quality.gd").read_text()
          assert "has_atmospheric_lut && atmospheric_lut_strength > 0.001" in shader
          assert "ClassDB.class_exists(\"SkyScatteringLUT\")" in atmosphere
          assert "solar_elevation" in atmosphere
          assert '"atmospheric_lut_strength"' in quality
          assert '"sun_transmittance_strength"' in quality
          assert '"sample_sun_transmittance"' in atmosphere
          assert 'sun.light_color = SolarIrradiance.tint(' in atmosphere
          assert 'SolarIrradiance.SAMPLE_INTERVAL' in atmosphere
          solar = Path("game/scripts/client/solar_irradiance.gd").read_text()
          assert 'static func valid(sample: Color)' in solar
          test_runner = Path("game/tests/run_all.gd").read_text()
          assert "test_sun_atmospheric_light.gd" in test_runner
          PY
