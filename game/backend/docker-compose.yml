# Accounts, characters, storage, chat, guilds, the market and leaderboards come from Nakama
# (Heroic Labs, open source); only the real-time 3D world runs in the headless Godot server.
#   docker compose -f game/backend/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 20
  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.37.0
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1 --database.address postgres:localdb@postgres:5432/nakama
        --logger.level INFO --session.token_expiry_sec 7200
        --runtime.path /nakama/data/modules
        --socket.server_key albion_after_key
        --runtime.http_key albion_http_key
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./modules:/nakama/data/modules
    ports:
      - "7349:7349" # gRPC
      - "7350:7350" # HTTP / WebSocket API
      - "7351:7351" # Console
    restart: unless-stopped
volumes:
  pgdata:
